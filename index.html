<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RAYCAST // FPS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden; background:#05060a;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color:#c8f0ff; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    overscroll-behavior:none;
    position:fixed; inset:0;
  }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }

  #stage { position:relative; touch-action:none; }
  canvas#screen {
    display:block; width:100%; height:100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background:#000;
    cursor:crosshair;
    touch-action:none;
  }

  /* ---------- HUD ---------- */
  #hud {
    position:absolute; inset:0; pointer-events:none;
    font-size:1em; letter-spacing:.05em;
  }
  .panel {
    position:absolute; bottom:2.2em; display:flex; gap:.6em; align-items:baseline;
    text-shadow:0 0 .6em currentColor;
  }
  #hpPanel   { left:2em;  color:#54ff9f; }
  #ammoPanel { right:2em; color:#ffd35c; }
  #scorePanel{ left:50%; transform:translateX(-50%); color:#7fd8ff; }
  .lbl { opacity:.55; font-size:.72em; }
  .val { font-size:1.5em; font-weight:700; }

  #hpBar {
    position:absolute; left:2em; bottom:1.4em; width:9em; height:.35em;
    background:#0d1a16; border:1px solid #1d4a38;
  }
  #hpFill { height:100%; width:100%; background:#54ff9f; transition:width .12s linear; }

  #cross {
    position:absolute; left:50%; top:50%; width:1.4em; height:1.4em;
    transform:translate(-50%,-50%);
  }
  #cross::before, #cross::after {
    content:''; position:absolute; background:#8effd0; box-shadow:0 0 .4em #8effd0;
    opacity:.85;
  }
  #cross::before { left:50%; top:0; width:2px; height:100%; margin-left:-1px; }
  #cross::after  { top:50%; left:0; height:2px; width:100%; margin-top:-1px; }
  #cross span {
    position:absolute; left:50%; top:50%; width:.5em; height:.5em;
    transform:translate(-50%,-50%); background:#05060a; border-radius:50%;
  }

  #hitmark {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(45deg);
    width:1.6em; height:1.6em; opacity:0; pointer-events:none;
  }
  #hitmark::before, #hitmark::after {
    content:''; position:absolute; background:#ff5a5a;
  }
  #hitmark::before { left:50%; top:0; width:3px; height:100%; margin-left:-1.5px; }
  #hitmark::after  { top:50%; left:0; height:3px; width:100%; margin-top:-1.5px; }

  #lockHint {
    position:absolute; left:50%; top:1.1em; transform:translateX(-50%);
    font-size:.62em; letter-spacing:.14em; color:#ffd35c; opacity:.85;
    text-shadow:0 0 .6em #ffd35c; white-space:nowrap;
  }
  #lockHint.hidden { display:none; }

  /* ---------- overlay ---------- */
  #overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:.9em; text-align:center;
    background:radial-gradient(ellipse at center, rgba(6,14,24,.82), rgba(2,4,8,.96));
    backdrop-filter: blur(2px);
    pointer-events:auto; padding:2em;
    touch-action:manipulation;
  }
  #overlay.hidden { display:none; }
  #title {
    font-size:2.6em; font-weight:800; letter-spacing:.18em; color:#8effd0;
    text-shadow:0 0 1em #1cffa0, 0 0 .3em #fff;
  }
  #sub { font-size:.95em; opacity:.7; line-height:1.9; max-width:34em; }
  #sub b { color:#ffd35c; }
  #btn {
    margin-top:.6em; padding:.8em 2.4em; font:inherit; font-size:1em; font-weight:700;
    letter-spacing:.14em; color:#04120c; background:#8effd0; border:none;
    cursor:pointer; box-shadow:0 0 1.4em #1cffa0aa; transition:transform .08s, box-shadow .2s;
    border-radius:4px; min-height:48px; touch-action:manipulation;
  }
  #btn:hover { transform:scale(1.05); box-shadow:0 0 2em #1cffa0; }
  #btn:active { transform:scale(.97); }
  .dead #title { color:#ff6a6a; text-shadow:0 0 1em #ff2020; }
  .dead #btn { background:#ff6a6a; box-shadow:0 0 1.4em #ff2020aa; }
  .win #title { color:#ffe066; text-shadow:0 0 1em #ffb300; }
  .win #btn { background:#ffe066; box-shadow:0 0 1.4em #ffb300aa; }

  #flash {
    position:absolute; inset:0; background:#ff2a2a; opacity:0; pointer-events:none;
    mix-blend-mode:screen;
  }

  /* ═══════════════════════════════════════════════════════
     TOUCH CONTROLS
     ═══════════════════════════════════════════════════════ */
  #touchUI {
    position:absolute; inset:0;
    pointer-events:none;
    display:none;
    z-index:5;
  }
  body.touch-mode #touchUI { display:block; }

  #joyBase {
    position:absolute;
    left: max(16px, 4vmin);
    bottom: max(16px, 5vmin);
    width: clamp(110px, 26vmin, 200px);
    height: clamp(110px, 26vmin, 200px);
    border-radius: 50%;
    background: radial-gradient(circle,
                rgba(142,255,208,0.05) 0%,
                rgba(142,255,208,0.10) 60%,
                rgba(142,255,208,0.03) 100%);
    border: 2px solid rgba(142, 255, 208, 0.28);
    box-shadow:
      inset 0 0 24px rgba(142, 255, 208, 0.08),
      0 0 20px rgba(0, 0, 0, 0.6);
    pointer-events:none;
  }

  #joyKnob {
    position:absolute;
    left:50%; top:50%;
    width: 40%; height: 40%;
    border-radius: 50%;
    background: radial-gradient(circle,
                rgba(210,255,235,0.9) 0%,
                rgba(142,255,208,0.55) 70%,
                rgba(142,255,208,0.25) 100%);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 18px rgba(142, 255, 208, 0.6);
    will-change: transform;
    pointer-events:none;
  }

  #fireBtn {
    position:absolute;
    right: max(16px, 4vmin);
    bottom: max(16px, 5vmin);
    width: clamp(84px, 20vmin, 150px);
    height: clamp(84px, 20vmin, 150px);
    border-radius: 50%;
    background: radial-gradient(circle,
                rgba(255,100,100,0.28) 0%,
                rgba(255,60,60,0.12) 70%,
                rgba(255,60,60,0.05) 100%);
    border: 2px solid rgba(255, 142, 142, 0.5);
    box-shadow:
      inset 0 0 24px rgba(255, 100, 100, 0.15),
      0 0 20px rgba(0, 0, 0, 0.6);
    color: rgba(255, 215, 215, 0.95);
    font: inherit; font-weight: 800;
    font-size: clamp(12px, 2.4vmin, 18px);
    letter-spacing: 0.14em;
    display: flex; align-items: center; justify-content: center;
    text-shadow: 0 0 10px rgba(255, 100, 100, 0.9);
    transition: transform 0.06s ease-out, background 0.06s ease-out;
    will-change: transform;
    pointer-events:none;
  }
  #fireBtn.active {
    transform: scale(0.93);
    background: radial-gradient(circle,
                rgba(255,100,100,0.55) 0%,
                rgba(255,60,60,0.30) 100%);
  }

  /* pause button (mobile) */
  #pauseBtn {
    position:absolute;
    top: max(10px, 2vmin);
    right: max(10px, 2vmin);
    width: clamp(38px, 7vmin, 54px);
    height: clamp(38px, 7vmin, 54px);
    border-radius: 50%;
    background: rgba(10, 20, 30, 0.65);
    border: 2px solid rgba(142, 255, 208, 0.45);
    display: none;
    align-items: center; justify-content: center;
    cursor: pointer;
    pointer-events: auto;
    z-index: 20;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #pauseBtn span {
    display: inline-block;
    width: 3px; height: clamp(13px, 2.4vmin, 18px);
    background: #8effd0;
    margin: 0 2px;
    border-radius: 1.5px;
    box-shadow: 0 0 6px #8effd0;
  }
  body.touch-mode #pauseBtn { display: flex; }
  body.touch-mode #lockHint { display: none !important; }

  /* mobile HUD reflow: move stats to the top so they clear the controls */
  body.touch-mode #hud { font-size: 0.95em; }
  body.touch-mode .panel { bottom: auto; }
  body.touch-mode #hpPanel {
    top: max(10px, 2vmin);
    left: max(10px, 2vmin);
  }
  body.touch-mode #hpBar {
    bottom: auto;
    top: calc(max(10px, 2vmin) + 2.4em);
    left: max(10px, 2vmin);
    width: 7em;
  }
  body.touch-mode #ammoPanel {
    top: calc(max(10px, 2vmin) + 3.6em);
    left: max(10px, 2vmin);
    right: auto;
  }
  body.touch-mode #scorePanel {
    top: max(10px, 2vmin);
    left: 50%;
    bottom: auto;
    transform: translateX(-50%);
  }
  body.touch-mode #cross { width: 1.7em; height: 1.7em; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="screen"></canvas>

    <div id="hud">
      <div id="cross"><span></span></div>
      <div id="hitmark"></div>
      <div id="lockHint" class="hidden"></div>

      <div class="panel" id="hpPanel">
        <span class="lbl">HP</span><span class="val" id="hpVal">100</span>
      </div>
      <div id="hpBar"><div id="hpFill"></div></div>

      <div class="panel" id="ammoPanel">
        <span class="lbl">AMMO</span><span class="val" id="ammoVal">24</span>
      </div>

      <div class="panel" id="scorePanel">
        <span class="lbl">SCORE</span><span class="val" id="scoreVal">0</span>
      </div>
    </div>

    <div id="touchUI">
      <div id="joyBase"><div id="joyKnob"></div></div>
      <div id="fireBtn">FIRE</div>
    </div>

    <div id="pauseBtn"><span></span><span></span></div>

    <div id="flash"></div>

    <div id="overlay">
      <div id="title">RAYCAST</div>
      <div id="sub">
        <b>WASD</b> move &nbsp;·&nbsp; <b>MOUSE</b> look &nbsp;·&nbsp; <b>CLICK</b> shoot<br>
        <b>SHIFT</b> sprint &nbsp;·&nbsp; <b>SPACE</b> fire &nbsp;·&nbsp; <b>ESC</b> pause<br>
        <span style="opacity:.55">— on mobile: joystick to move, drag to look, FIRE to shoot —</span><br><br>
        Destroy every hostile drone. Grab <span style="color:#54ff9f">medkits</span>
        and <span style="color:#ffd35c">ammo</span> along the way.
      </div>
      <button id="btn">ENTER THE COMPLEX</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ═══════════════════════════════════════════════════════════
   1. CONSTANTS
   ═══════════════════════════════════════════════════════════ */
const W = 480, H = 270;
const TEX = 64;
const SHADES = 24;
const FOV = 0.66;
const MOVE_SPEED = 3.0;
const SPRINT_MULT = 1.75;
const MOUSE_SENS = 0.0022;
const TOUCH_SENS = 0.0042;
const PLAYER_RADIUS = 0.22;
const MAX_DIST_LIGHT = 0.22;

/* ═══════════════════════════════════════════════════════════
   2. UTILITIES
   ═══════════════════════════════════════════════════════════ */
const rgb = (r, g, b) =>
  ((255 << 24) | ((b & 255) << 16) | ((g & 255) << 8) | (r & 255)) >>> 0;

function shadeColor(c, s) {
  if (c === 0) return 0;
  const r = (c & 255) * s;
  const g = ((c >> 8) & 255) * s;
  const b = ((c >> 16) & 255) * s;
  return ((255 << 24) | ((b | 0) << 16) | ((g | 0) << 8) | (r | 0)) >>> 0;
}

let _seed = 0x9e3779b9;
const rnd = () => {
  _seed = (Math.imul(_seed, 1664525) + 1013904223) >>> 0;
  return _seed / 4294967296;
};

function genTex(fn) {
  const a = new Uint32Array(TEX * TEX);
  for (let y = 0; y < TEX; y++)
    for (let x = 0; x < TEX; x++)
      a[y * TEX + x] = fn(x, y);
  return a;
}

function buildShades(tex) {
  const levels = new Array(SHADES);
  for (let i = 0; i < SHADES; i++) {
    const s = (i + 1) / SHADES;
    const out = new Uint32Array(tex.length);
    for (let p = 0; p < tex.length; p++) out[p] = shadeColor(tex[p], s);
    levels[i] = out;
  }
  return levels;
}

/* ═══════════════════════════════════════════════════════════
   3. TEXTURES
   ═══════════════════════════════════════════════════════════ */
const texBrick = genTex((x, y) => {
  const row = (y / 16) | 0;
  const bx = (x + (row & 1) * 16) % 32;
  const by = y % 16;
  if (bx < 2 || by < 2) return rgb(100, 94, 88);
  const n = (rnd() * 26) | 0;
  return rgb(142 + n, 62 + n * 0.55, 48 + n * 0.35);
});

const texStone = genTex((x, y) => {
  const bx = x % 32, by = y % 32;
  if (bx < 3 || by < 3) return rgb(50, 52, 60);
  const n = (rnd() * 30) | 0;
  return rgb(96 + n, 98 + n, 110 + n);
});

const texMetal = genTex((x, y) => {
  const bx = x % 32, by = y % 32;
  const rivet =
    ((bx - 8) ** 2 + (by - 8) ** 2 < 11) ||
    ((bx - 24) ** 2 + (by - 8) ** 2 < 11) ||
    ((bx - 8) ** 2 + (by - 24) ** 2 < 11) ||
    ((bx - 24) ** 2 + (by - 24) ** 2 < 11);
  if (rivet) return rgb(178, 188, 204);
  if (bx < 2 || by < 2) return rgb(46, 56, 70);
  const stripe = (y % 8 < 4) ? 9 : 0;
  return rgb(76 + stripe, 92 + stripe, 114 + stripe);
});

const texWood = genTex((x, y) => {
  const g = Math.sin(x * 0.5) * 5 + Math.sin(x * 1.3 + y * 0.12) * 3;
  const n = (rnd() * 12) | 0;
  return rgb(118 + g + n, 74 + g * 0.7 + n, 40 + g * 0.5 + n);
});

const texFloor = genTex((x, y) => {
  const cx = (x / 16) | 0, cy = (y / 16) | 0;
  const dark = (cx + cy) & 1;
  const n = (rnd() * 16) | 0;
  const base = dark ? 58 : 86;
  return rgb(base + n, base + n - 4, base + n - 10);
});

const texCeil = genTex((x, y) => {
  const n = (rnd() * 16) | 0;
  return rgb(36 + n, 37 + n, 46 + n);
});

const texEnemy = genTex((x, y) => {
  const cx = x - 31.5, cy = y - 31.5;
  const d = Math.sqrt(cx * cx + cy * cy);
  if (d > 27) return 0;
  if (d > 23) return rgb(96, 28, 30);
  const ed = Math.sqrt(cx * cx + (cy + 2) ** 2);
  if (ed < 6)  return rgb(255, 232, 96);
  if (ed < 11) return rgb(232, 58, 44);
  if (ed < 14) return rgb(252, 242, 236);
  const t = 1 - d / 32;
  const n = (rnd() * 18) | 0;
  return rgb(124 * t + 28 + n, 34 * t + 20 + n, 40 * t + 26 + n);
});

const texHealth = genTex((x, y) => {
  const cx = x - 31.5, cy = y - 31.5;
  const ax = Math.abs(cx), ay = Math.abs(cy);
  if (ax > 19 || ay > 19) return 0;
  if ((ax < 5.5 && ay < 15) || (ax < 15 && ay < 5.5)) return rgb(226, 44, 44);
  if (ax > 16.5 || ay > 16.5) return rgb(126, 126, 132);
  return rgb(238, 238, 240);
});

const texAmmo = genTex((x, y) => {
  const cx = x - 31.5, cy = y - 31.5;
  const ax = Math.abs(cx), ay = Math.abs(cy);
  if (ax > 19 || ay > 19) return 0;
  if (ax > 16.5 || ay > 16.5) return rgb(66, 52, 22);
  const bullet = (Math.abs((x % 10) - 5) < 2.4) && y > 18 && y < 48;
  if (bullet) return rgb(255, 214, 96);
  return rgb(44, 48, 58);
});

const WALL_SHADES = [null, buildShades(texBrick), buildShades(texStone),
                     buildShades(texMetal), buildShades(texWood)];
const FLOOR_SHADES  = buildShades(texFloor);
const CEIL_SHADES   = buildShades(texCeil);
const ENEMY_SHADES  = buildShades(texEnemy);
const HEALTH_SHADES = buildShades(texHealth);
const AMMO_SHADES   = buildShades(texAmmo);

/* ═══════════════════════════════════════════════════════════
   4. MAP
   ═══════════════════════════════════════════════════════════ */
const MAP_STR = [
  "222222222222222222222222",
  "2......2.........2.....2",
  "2......2.........2.....2",
  "2..33..2....44...2..3..2",
  "2..33..2....44...2..3..2",
  "2......2.........2.....2",
  "2......2.........2.....2",
  "222.2222....2....2222222",
  "2...........2..........2",
  "2...........2..........2",
  "2....111....2....111...2",
  "2....1......2......1...2",
  "2....1......2......1...2",
  "2....1111...2...1111...2",
  "2...........2..........2",
  "2...........2..........2",
  "2222222.22222.2222222222",
  "2......................2",
  "2......................2",
  "2....3333......4444....2",
  "2....3333......4444....2",
  "2......................2",
  "2......................2",
  "222222222222222222222222"
];
const MAP_W = 24, MAP_H = 24;
const grid = new Uint8Array(MAP_W * MAP_H);
for (let y = 0; y < MAP_H; y++)
  for (let x = 0; x < MAP_W; x++)
    grid[y * MAP_W + x] = MAP_STR[y][x] === '.' ? 0 : MAP_STR[y].charCodeAt(x) - 48;

/* ═══════════════════════════════════════════════════════════
   5. CANVAS
   ═══════════════════════════════════════════════════════════ */
const canvas = document.getElementById('screen');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d', { alpha: false });
const imgData = ctx.createImageData(W, H);
const buf = new Uint32Array(imgData.data.buffer);
const zbuf = new Float32Array(W);

const stage = document.getElementById('stage');
function resize() {
  const ar = W / H;
  let cw = window.innerWidth, ch = window.innerHeight;
  if (cw / ch > ar) cw = ch * ar; else ch = cw / ar;
  stage.style.width  = cw + 'px';
  stage.style.height = ch + 'px';
  stage.style.fontSize = Math.max(9, ch * 0.042) + 'px';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 80));
resize();

/* ═══════════════════════════════════════════════════════════
   6. STATE
   ═══════════════════════════════════════════════════════════ */
const P = {
  x: 3.5, y: 21.5,
  dirX: 0, dirY: -1,
  planeX: 0, planeY: 0,
  health: 100, ammo: 24, score: 0, kills: 0
};
P.planeX = -P.dirY * FOV;
P.planeY =  P.dirX * FOV;

let enemies = [];
let pickups = [];
let sprites = [];

let running = false;
let paused  = true;
let gameOver = false;

let shootCooldown = 0;
let muzzle = 0;
let recoil = 0;
let bobPhase = 0;
let moveAmount = 0;
let damageFlash = 0;
let hitMarker = 0;

const keys = Object.create(null);

let lockDenied = false;
let mouseDown  = false;
let touchDetected = false;

/* touch state */
const touchState = {
  joyId: null,
  joyCX: 0, joyCY: 0, joyMaxR: 1,
  joyVecX: 0, joyVecY: 0,
  lookId: null,
  lookLastX: 0, lookLastY: 0,
  fireId: null
};

/* DOM refs */
const joyBaseEl  = document.getElementById('joyBase');
const joyKnobEl  = document.getElementById('joyKnob');
const fireBtnEl  = document.getElementById('fireBtn');
const pauseBtnEl = document.getElementById('pauseBtn');

/* ═══════════════════════════════════════════════════════════
   7. WORLD HELPERS
   ═══════════════════════════════════════════════════════════ */
function isWall(x, y) {
  if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) return true;
  return grid[y * MAP_W + x] > 0;
}

function canStand(x, y) {
  const r = PLAYER_RADIUS;
  const x0 = (x - r) | 0, x1 = (x + r) | 0;
  const y0 = (y - r) | 0, y1 = (y + r) | 0;
  for (let yy = y0; yy <= y1; yy++)
    for (let xx = x0; xx <= x1; xx++)
      if (isWall(xx, yy)) return false;
  return true;
}

function lineOfSight(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  const steps = Math.ceil(Math.hypot(dx, dy) * 10);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (isWall((x0 + dx * t) | 0, (y0 + dy * t) | 0)) return false;
  }
  return true;
}

function openCells() {
  const out = [];
  for (let y = 0; y < MAP_H; y++)
    for (let x = 0; x < MAP_W; x++)
      if (grid[y * MAP_W + x] === 0) out.push([x + 0.5, y + 0.5]);
  return out;
}

function spawnEntities() {
  const cells = openCells().filter(([x, y]) => Math.hypot(x - P.x, y - P.y) > 7);

  for (let i = cells.length - 1; i > 0; i--) {
    const j = (rnd() * (i + 1)) | 0;
    [cells[i], cells[j]] = [cells[j], cells[i]];
  }

  enemies = [];
  pickups = [];

  const ENEMY_COUNT = 8;
  for (let i = 0; i < ENEMY_COUNT && i < cells.length; i++) {
    const [x, y] = cells[i];
    enemies.push({
      x, y, hp: 3, active: true, awake: false,
      speed: 1.35 + rnd() * 0.6,
      cool: 0, hurt: 0,
      scale: 0.85, vOffset: 0.08,
      shades: ENEMY_SHADES
    });
  }

  for (let i = ENEMY_COUNT; i < ENEMY_COUNT + 10 && i < cells.length; i++) {
    const [x, y] = cells[i];
    const type = (i % 2 === 0) ? 'health' : 'ammo';
    pickups.push({
      x, y, type, active: true,
      scale: 0.36, vOffset: 0.33, hurt: 0,
      shades: type === 'health' ? HEALTH_SHADES : AMMO_SHADES
    });
  }

  rebuildSpriteList();
}

function rebuildSpriteList() {
  sprites = [];
  for (const e of enemies) if (e.active) sprites.push(e);
  for (const p of pickups) if (p.active) sprites.push(p);
}

/* ═══════════════════════════════════════════════════════════
   8. RENDERER
   ═══════════════════════════════════════════════════════════ */
const HORIZON_COLOR = rgb(14, 16, 22);

function renderWorld() {
  const posX = P.x, posY = P.y;
  const dirX = P.dirX, dirY = P.dirY;
  const planeX = P.planeX, planeY = P.planeY;

  /* ---- floor + ceiling ---- */
  const rayDirX0 = dirX - planeX, rayDirY0 = dirY - planeY;
  const rayDirX1 = dirX + planeX, rayDirY1 = dirY + planeY;

  for (let y = 0; y < H; y++) {
    const dy = y - H / 2;
    const isFloor = dy > 0;
    const p = Math.abs(dy);
    const rowOff = y * W;

    if (p < 0.5) {
      for (let x = 0; x < W; x++) buf[rowOff + x] = HORIZON_COLOR;
      continue;
    }

    const rowDistance = (0.5 * H) / p;
    const stepX = rowDistance * (rayDirX1 - rayDirX0) / W;
    const stepY = rowDistance * (rayDirY1 - rayDirY0) / W;

    let fx = posX + rowDistance * rayDirX0;
    let fy = posY + rowDistance * rayDirY0;

    const light = 1 / (1 + rowDistance * MAX_DIST_LIGHT);
    let lvl = (light * SHADES) | 0;
    if (lvl > SHADES - 1) lvl = SHADES - 1;
    const tex = isFloor ? FLOOR_SHADES[lvl] : CEIL_SHADES[lvl];

    for (let x = 0; x < W; x++) {
      const cx = fx | 0, cy = fy | 0;
      const tx = ((fx - cx) * TEX) & 63;
      const ty = ((fy - cy) * TEX) & 63;
      buf[rowOff + x] = tex[(ty << 6) | tx];
      fx += stepX;
      fy += stepY;
    }
  }

  /* ---- walls ---- */
  for (let x = 0; x < W; x++) {
    const cameraX = 2 * x / W - 1;
    const rdx = dirX + planeX * cameraX;
    const rdy = dirY + planeY * cameraX;

    let mapX = posX | 0, mapY = posY | 0;
    const ddx = rdx === 0 ? 1e30 : Math.abs(1 / rdx);
    const ddy = rdy === 0 ? 1e30 : Math.abs(1 / rdy);

    let stepX, stepY, sdx, sdy;
    if (rdx < 0) { stepX = -1; sdx = (posX - mapX) * ddx; }
    else         { stepX =  1; sdx = (mapX + 1 - posX) * ddx; }
    if (rdy < 0) { stepY = -1; sdy = (posY - mapY) * ddy; }
    else         { stepY =  1; sdy = (mapY + 1 - posY) * ddy; }

    let side = 0, tile = 0, hit = false, guard = 0;
    while (!hit && guard++ < 128) {
      if (sdx < sdy) { sdx += ddx; mapX += stepX; side = 0; }
      else           { sdy += ddy; mapY += stepY; side = 1; }
      if (mapX < 0 || mapX >= MAP_W || mapY < 0 || mapY >= MAP_H) break;
      tile = grid[mapY * MAP_W + mapX];
      if (tile > 0) hit = true;
    }

    if (!hit || tile === 0) { zbuf[x] = 1e30; continue; }

    let perp = side === 0 ? sdx - ddx : sdy - ddy;
    if (perp < 0.02) perp = 0.02;
    zbuf[x] = perp;

    const lineHeight = (H / perp) | 0;
    const y0 = Math.max(0, (-lineHeight / 2 + H / 2) | 0);
    const y1 = Math.min(H, ( lineHeight / 2 + H / 2) | 0);

    let wallX = side === 0 ? posY + perp * rdy : posX + perp * rdx;
    wallX -= Math.floor(wallX);
    let texX = (wallX * TEX) | 0;
    if (side === 0 && rdx > 0) texX = TEX - texX - 1;
    if (side === 1 && rdy < 0) texX = TEX - texX - 1;
    texX &= 63;

    let light = 1 / (1 + perp * MAX_DIST_LIGHT);
    if (side === 1) light *= 0.68;
    let lvl = (light * SHADES) | 0;
    if (lvl > SHADES - 1) lvl = SHADES - 1;
    if (lvl < 0) lvl = 0;
    const tex = WALL_SHADES[tile][lvl];

    const stepTex = TEX / lineHeight;
    let texPos = (y0 - H / 2 + lineHeight / 2) * stepTex;
    let o = y0 * W + x;

    for (let y = y0; y < y1; y++) {
      buf[o] = tex[((texPos & 63) << 6) | texX];
      texPos += stepTex;
      o += W;
    }
  }

  renderSprites();
}

function renderSprites() {
  const posX = P.x, posY = P.y;
  const dirX = P.dirX, dirY = P.dirY;
  const planeX = P.planeX, planeY = P.planeY;

  const list = [];
  for (const s of sprites) {
    const dx = s.x - posX, dy = s.y - posY;
    list.push({ s, d: dx * dx + dy * dy });
  }
  list.sort((a, b) => b.d - a.d);

  const invDet = 1 / (planeX * dirY - dirX * planeY);

  for (let i = 0; i < list.length; i++) {
    const s = list[i].s;
    const spx = s.x - posX, spy = s.y - posY;

    const tx = invDet * (dirY * spx - dirX * spy);
    const ty = invDet * (-planeY * spx + planeX * spy);
    if (ty <= 0.2) continue;

    const screenX = ((W / 2) * (1 + tx / ty)) | 0;
    const sh = Math.abs((H / ty) * s.scale) | 0;
    const sw = sh;
    if (sh < 1 || sw < 1) continue;

    const vOff = ((H / ty) * s.vOffset) | 0;
    const dStartY = (-sh / 2 + H / 2 + vOff) | 0;
    const dEndY   = ( sh / 2 + H / 2 + vOff) | 0;
    const dStartX = (-sw / 2 + screenX) | 0;
    const dEndX   = ( sw / 2 + screenX) | 0;

    const y0 = Math.max(0, dStartY), y1 = Math.min(H, dEndY);
    const x0 = Math.max(0, dStartX), x1 = Math.min(W, dEndX);

    let light = 1 / (1 + ty * MAX_DIST_LIGHT);
    if (s.hurt > 0) light = Math.min(1, light + 0.5);
    let lvl = (light * SHADES) | 0;
    if (lvl > SHADES - 1) lvl = SHADES - 1;
    if (lvl < 0) lvl = 0;

    const tex = s.shades[lvl];
    const stepTexY = TEX / sh;

    for (let x = x0; x < x1; x++) {
      if (ty >= zbuf[x]) continue;
      const texX = (((x - dStartX) * TEX / sw) | 0) & 63;
      let texPos = (y0 - dStartY) * stepTexY;
      let o = y0 * W + x;
      for (let y = y0; y < y1; y++) {
        const c = tex[(((texPos & 63) << 6) | texX)];
        if (c !== 0) buf[o] = c;
        texPos += stepTexY;
        o += W;
      }
    }
  }
}

function drawWeapon() {
  const g = ctx;
  const bobX = Math.sin(bobPhase) * 4 * moveAmount;
  const bobY = Math.abs(Math.cos(bobPhase)) * 3.5 * moveAmount;
  const cx = W / 2 + bobX;
  const by = H + bobY + recoil * 10;

  if (muzzle > 0) {
    const a = muzzle / 0.07;
    g.globalAlpha = Math.min(1, a);
    g.fillStyle = 'rgba(255,214,110,0.95)';
    g.beginPath(); g.arc(cx, by - 78, 15 + Math.random() * 7, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,230,1)';
    g.beginPath(); g.arc(cx, by - 78, 7, 0, 7); g.fill();
    g.globalAlpha = 1;
  }

  g.fillStyle = '#1c212b';
  g.beginPath();
  g.moveTo(cx - 23, by);
  g.lineTo(cx - 12, by - 54);
  g.lineTo(cx + 12, by - 54);
  g.lineTo(cx + 23, by);
  g.closePath();
  g.fill();

  g.fillStyle = '#0e1117';
  g.fillRect(cx - 6, by - 80, 12, 30);
  g.fillStyle = '#232a36';
  g.fillRect(cx - 6, by - 80, 4, 30);

  g.fillStyle = '#3a4354';
  g.fillRect(cx - 11, by - 52, 22, 4);

  g.fillStyle = '#3a2a22';
  g.beginPath();
  g.moveTo(cx - 23, by);
  g.lineTo(cx - 13, by - 42);
  g.lineTo(cx - 7,  by - 30);
  g.lineTo(cx - 16, by);
  g.closePath();
  g.fill();
  g.beginPath();
  g.moveTo(cx + 23, by);
  g.lineTo(cx + 13, by - 42);
  g.lineTo(cx + 7,  by - 30);
  g.lineTo(cx + 16, by);
  g.closePath();
  g.fill();
}

function drawMinimap() {
  const S = 2;
  const ox = 8, oy = 8;
  const mw = MAP_W * S, mh = MAP_H * S;

  ctx.globalAlpha = 0.72;
  ctx.fillStyle = '#04070c';
  ctx.fillRect(ox - 1, oy - 1, mw + 2, mh + 2);
  ctx.globalAlpha = 1;

  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const t = grid[y * MAP_W + x];
      if (t === 0) continue;
      ctx.fillStyle = ['#000', '#7a3b30', '#4c5060', '#4a5a72', '#6b4a2a'][t];
      ctx.fillRect(ox + x * S, oy + y * S, S, S);
    }
  }

  for (const p of pickups) {
    if (!p.active) continue;
    ctx.fillStyle = p.type === 'health' ? '#54ff9f' : '#ffd35c';
    ctx.fillRect(ox + p.x * S - 1, oy + p.y * S - 1, 2, 2);
  }

  for (const e of enemies) {
    if (!e.active) continue;
    ctx.fillStyle = e.awake ? '#ff4d4d' : '#8b3030';
    ctx.fillRect(ox + e.x * S - 1, oy + e.y * S - 1, 2, 2);
  }

  ctx.fillStyle = '#8effd0';
  ctx.fillRect(ox + P.x * S - 1.5, oy + P.y * S - 1.5, 3, 3);

  ctx.strokeStyle = '#8effd0';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(ox + P.x * S, oy + P.y * S);
  ctx.lineTo(ox + (P.x + P.dirX * 2.5) * S, oy + (P.y + P.dirY * 2.5) * S);
  ctx.stroke();
}

/* ═══════════════════════════════════════════════════════════
   9. UPDATE
   ═══════════════════════════════════════════════════════════ */
function rotatePlayer(a) {
  const c = Math.cos(a), s = Math.sin(a);
  const odx = P.dirX, opx = P.planeX;
  P.dirX   = odx * c - P.dirY * s;
  P.dirY   = odx * s + P.dirY * c;
  P.planeX = opx * c - P.planeY * s;
  P.planeY = opx * s + P.planeY * c;
}

function update(dt) {
  /* ---- movement: combine keyboard + joystick ---- */
  let fwd = touchState.joyVecY;
  let str = touchState.joyVecX;

  if (keys['w'] || keys['arrowup'])    fwd += 1;
  if (keys['s'] || keys['arrowdown'])  fwd -= 1;
  if (keys['a']) str -= 1;
  if (keys['d']) str += 1;
  if (keys['arrowleft'])  rotatePlayer(-1.8 * dt);
  if (keys['arrowright']) rotatePlayer( 1.8 * dt);

  // clamp combined vector
  const mag = Math.hypot(fwd, str);
  if (mag > 1) { fwd /= mag; str /= mag; }

  // auto-sprint when joystick pushed near the edge
  const joyMag = Math.hypot(touchState.joyVecX, touchState.joyVecY);
  const sprint = (keys['shift'] || joyMag > 0.88) ? SPRINT_MULT : 1;
  const spd = MOVE_SPEED * sprint * dt;

  const sx = -P.dirY, sy = P.dirX;
  const dx = (P.dirX * fwd + sx * str) * spd;
  const dy = (P.dirY * fwd + sy * str) * spd;

  if (dx || dy) {
    if (canStand(P.x + dx, P.y)) P.x += dx;
    if (canStand(P.x, P.y + dy)) P.y += dy;
    moveAmount = Math.min(1, moveAmount + dt * 6);
  } else {
    moveAmount = Math.max(0, moveAmount - dt * 6);
  }
  bobPhase += dt * (sprint > 1 ? 13 : 9) * (moveAmount > 0.01 ? 1 : 0);

  /* ---- timers ---- */
  if (shootCooldown > 0) shootCooldown -= dt;
  if (muzzle > 0) muzzle -= dt;
  if (recoil > 0) recoil = Math.max(0, recoil - dt * 6);
  if (hitMarker > 0) hitMarker -= dt;

  /* ---- auto-fire while held (mouse / touch / space) ---- */
  if (mouseDown || touchState.fireId !== null || keys[' ']) shoot();

  /* ---- enemies ---- */
  for (const e of enemies) {
    if (!e.active) continue;
    if (e.hurt > 0) e.hurt -= dt;

    const ddx = P.x - e.x, ddy = P.y - e.y;
    const dist = Math.hypot(ddx, ddy);

    if (!e.awake && dist < 13 && lineOfSight(e.x, e.y, P.x, P.y))
      e.awake = true;

    if (!e.awake) continue;

    if (dist > 0.8) {
      const step = e.speed * dt;
      const nx = e.x + (ddx / dist) * step;
      const ny = e.y + (ddy / dist) * step;
      if (canStand(nx, e.y)) e.x = nx;
      if (canStand(e.x, ny)) e.y = ny;
    }

    e.cool -= dt;
    if (dist < 1.15 && e.cool <= 0) {
      e.cool = 1.0;
      damagePlayer(7 + Math.random() * 7);
    }
  }

  /* ---- pickups ---- */
  for (const p of pickups) {
    if (!p.active) continue;
    if (Math.hypot(p.x - P.x, p.y - P.y) < 0.55) {
      p.active = false;
      if (p.type === 'health') P.health = Math.min(100, P.health + 25);
      else                     P.ammo += 14;
      P.score += 25;
      rebuildSpriteList();
    }
  }

  if (damageFlash > 0) damageFlash = Math.max(0, damageFlash - dt * 2.5);

  updateHUD();
}

function damagePlayer(amount) {
  if (gameOver) return;
  P.health -= amount;
  damageFlash = 1;
  if (P.health <= 0) { P.health = 0; endGame(false); }
}

function shoot() {
  if (!running || paused || gameOver) return;
  if (shootCooldown > 0) return;

  if (P.ammo <= 0) { shootCooldown = 0.3; return; }

  shootCooldown = 0.16;
  P.ammo--;
  muzzle = 0.07;
  recoil = 1;

  const invDet = 1 / (P.planeX * P.dirY - P.dirX * P.planeY);
  let best = null, bestD = Infinity;

  for (const e of enemies) {
    if (!e.active) continue;
    const sx = e.x - P.x, sy = e.y - P.y;
    const tx = invDet * (P.dirY * sx - P.dirX * sy);
    const ty = invDet * (-P.planeY * sx + P.planeX * sy);
    if (ty <= 0.25 || ty > 18) continue;
    if (Math.abs(tx / ty) > 0.16) continue;

    const screenX = ((W / 2) * (1 + tx / ty)) | 0;
    const col = screenX < 0 ? 0 : (screenX >= W ? W - 1 : screenX);
    if (zbuf[col] < ty - 0.45) continue;

    if (ty < bestD) { bestD = ty; best = e; }
  }

  if (best) {
    best.hp--;
    best.hurt = 0.16;
    best.awake = true;
    hitMarker = 0.12;
    if (best.hp <= 0) {
      best.active = false;
      P.kills++;
      P.score += 100;
      rebuildSpriteList();
      if (P.kills >= enemies.length) endGame(true);
    }
  }
  updateHUD();
}

/* ═══════════════════════════════════════════════════════════
   10. HUD
   ═══════════════════════════════════════════════════════════ */
const hpVal    = document.getElementById('hpVal');
const ammoVal  = document.getElementById('ammoVal');
const scoreVal = document.getElementById('scoreVal');
const hpFill   = document.getElementById('hpFill');
const flashEl  = document.getElementById('flash');
const hitEl    = document.getElementById('hitmark');
const lockHint = document.getElementById('lockHint');

function updateHUD() {
  hpVal.textContent = Math.ceil(P.health);
  ammoVal.textContent = P.ammo;
  scoreVal.textContent = P.score;
  hpFill.style.width = Math.max(0, P.health) + '%';
  hpFill.style.background =
    P.health > 60 ? '#54ff9f' : P.health > 30 ? '#ffd35c' : '#ff5a5a';
}

/* ═══════════════════════════════════════════════════════════
   11. INPUT — TOUCH
   ═══════════════════════════════════════════════════════════ */
function clearTouches() {
  touchState.joyId = null;
  touchState.lookId = null;
  touchState.fireId = null;
  touchState.joyVecX = 0;
  touchState.joyVecY = 0;
  joyKnobEl.style.transform = 'translate(-50%, -50%)';
  fireBtnEl.classList.remove('active');
}

function enableTouchMode() {
  if (touchDetected) return;
  touchDetected = true;
  document.body.classList.add('touch-mode');
  lockHint.classList.add('hidden');
}

function updateJoy(x, y) {
  let dx = x - touchState.joyCX;
  let dy = y - touchState.joyCY;
  const d = Math.hypot(dx, dy);
  const maxR = touchState.joyMaxR;
  if (d > maxR) {
    dx = dx / d * maxR;
    dy = dy / d * maxR;
  }
  touchState.joyVecX = dx / maxR;
  touchState.joyVecY = -dy / maxR;
  joyKnobEl.style.transform =
    `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}

function onTouchStart(e) {
  enableTouchMode();
  if (!running || paused || gameOver) return;

  const jr = joyBaseEl.getBoundingClientRect();
  const fr = fireBtnEl.getBoundingClientRect();
  const jcX = jr.left + jr.width / 2;
  const jcY = jr.top + jr.height / 2;
  const jcR = jr.width / 2;
  const fcX = fr.left + fr.width / 2;
  const fcY = fr.top + fr.height / 2;
  const fcR = fr.width / 2;

  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const x = t.clientX, y = t.clientY;

    const dJoy  = Math.hypot(x - jcX, y - jcY);
    const dFire = Math.hypot(x - fcX, y - fcY);

    // 1. joystick
    if (touchState.joyId === null && dJoy < jcR * 1.7) {
      touchState.joyId = t.identifier;
      touchState.joyCX = jcX;
      touchState.joyCY = jcY;
      touchState.joyMaxR = jcR * 0.6;
      updateJoy(x, y);
      continue;
    }

    // 2. fire
    if (touchState.fireId === null && dFire < fcR * 1.4) {
      touchState.fireId = t.identifier;
      fireBtnEl.classList.add('active');
      continue;
    }

    // 3. look
    if (touchState.lookId === null) {
      touchState.lookId = t.identifier;
      touchState.lookLastX = x;
      touchState.lookLastY = y;
    }
  }
  e.preventDefault();
}

function onTouchMove(e) {
  if (!running || paused || gameOver) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const x = t.clientX, y = t.clientY;

    if (t.identifier === touchState.joyId) {
      updateJoy(x, y);
    } else if (t.identifier === touchState.lookId) {
      const dx = x - touchState.lookLastX;
      if (dx) rotatePlayer(dx * TOUCH_SENS);
      touchState.lookLastX = x;
      touchState.lookLastY = y;
    }
  }
  e.preventDefault();
}

function onTouchEnd(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === touchState.joyId) {
      touchState.joyId = null;
      touchState.joyVecX = 0;
      touchState.joyVecY = 0;
      joyKnobEl.style.transform = 'translate(-50%, -50%)';
    } else if (t.identifier === touchState.lookId) {
      touchState.lookId = null;
    } else if (t.identifier === touchState.fireId) {
      touchState.fireId = null;
      fireBtnEl.classList.remove('active');
    }
  }
  e.preventDefault();
}

canvas.addEventListener('touchstart',  onTouchStart, { passive: false });
canvas.addEventListener('touchmove',   onTouchMove,  { passive: false });
canvas.addEventListener('touchend',    onTouchEnd,   { passive: false });
canvas.addEventListener('touchcancel', onTouchEnd,   { passive: false });

/* first-touch detection on the whole page (menu overlay included) */
window.addEventListener('touchstart', enableTouchMode, { passive: true });

/* ═══════════════════════════════════════════════════════════
   12. INPUT — KEYBOARD & MOUSE
   ═══════════════════════════════════════════════════════════ */
function isLocked() { return document.pointerLockElement === canvas; }

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'shift') keys['shift'] = true;

  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))
    e.preventDefault();

  if (k === 'escape' && running && !gameOver) {
    if (paused) resume(); else pause();
  }
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if (k === 'shift') keys['shift'] = false;
});
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  mouseDown = false;
});

document.addEventListener('mousemove', e => {
  if (touchDetected) return;                 // touch devices use touch handlers
  if (!running || paused || gameOver) return;
  if (!isLocked() && !mouseDown) return;
  const mx = e.movementX || 0;
  if (mx) rotatePlayer(mx * MOUSE_SENS);
});

canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (touchDetected) return;
  mouseDown = true;
  if (!running || paused || gameOver) return;
  if (!isLocked() && !lockDenied) requestLock();
});
window.addEventListener('mouseup', e => {
  if (e.button !== 0) return;
  mouseDown = false;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('pointerlockchange', () => {
  if (isLocked()) {
    lockHint.classList.add('hidden');
  } else if (running && !gameOver && !lockDenied && !touchDetected) {
    pause();
  }
});
document.addEventListener('pointerlockerror', () => {
  lockDenied = true;
  if (!touchDetected) {
    lockHint.textContent = 'POINTER LOCK BLOCKED — HOLD MOUSE TO LOOK';
    lockHint.classList.remove('hidden');
  }
});

/* ═══════════════════════════════════════════════════════════
   13. FLOW
   ═══════════════════════════════════════════════════════════ */
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const subEl   = document.getElementById('sub');
const btn     = document.getElementById('btn');

function requestLock() {
  if (touchDetected || lockDenied) return;
  try {
    const req = canvas.requestPointerLock();
    if (req && typeof req.catch === 'function') req.catch(() => { lockDenied = true; });
  } catch (_) { lockDenied = true; }
}

function pause() {
  if (gameOver || !running) return;
  paused = true;
  clearTouches();
  overlay.classList.remove('hidden');
  overlay.classList.remove('dead', 'win');
  titleEl.textContent = 'PAUSED';
  subEl.innerHTML = 'Tap below to jump back in.<br><b>ESC</b> toggles this menu.';
  btn.textContent = 'RESUME';
  if (isLocked()) document.exitPointerLock();
}

function resume() {
  if (!running || gameOver) return;
  paused = false;
  overlay.classList.add('hidden');
  requestLock();
}

function endGame(won) {
  gameOver = true;
  running = false;
  paused = true;
  clearTouches();
  if (isLocked()) document.exitPointerLock();

  overlay.classList.remove('hidden');
  overlay.classList.toggle('win', won);
  overlay.classList.toggle('dead', !won);

  if (won) {
    titleEl.textContent = 'COMPLEX CLEARED';
    subEl.innerHTML = `All hostiles eliminated.<br><br>
      Final score: <b>${P.score}</b><br>
      Health remaining: <b>${Math.ceil(P.health)}</b>`;
    btn.textContent = 'PLAY AGAIN';
  } else {
    titleEl.textContent = 'YOU DIED';
    subEl.innerHTML = `Kills: <b>${P.kills}</b> / ${enemies.length}<br>
      Final score: <b>${P.score}</b>`;
    btn.textContent = 'TRY AGAIN';
  }
}

function startGame() {
  P.x = 3.5; P.y = 21.5;
  P.dirX = 0; P.dirY = -1;
  P.planeX = -P.dirY * FOV;
  P.planeY =  P.dirX * FOV;
  P.health = 100;
  P.ammo = 24;
  P.score = 0;
  P.kills = 0;

  shootCooldown = 0; muzzle = 0; recoil = 0;
  bobPhase = 0; moveAmount = 0;
  damageFlash = 0; hitMarker = 0;
  for (const k in keys) keys[k] = false;
  mouseDown = false;
  clearTouches();

  gameOver = false;
  running  = true;
  paused   = false;

  spawnEntities();
  updateHUD();

  overlay.classList.add('hidden');
  overlay.classList.remove('dead', 'win');
  requestLock();
}

btn.addEventListener('click', () => {
  if (!running || gameOver) startGame();
  else if (paused)          resume();
  else                      requestLock();
});

pauseBtnEl.addEventListener('click', e => {
  e.stopPropagation();
  if (!running || gameOver) return;
  if (paused) resume(); else pause();
});
pauseBtnEl.addEventListener('touchstart', e => {
  e.stopPropagation();
  e.preventDefault();
  if (!running || gameOver) return;
  if (paused) resume(); else pause();
}, { passive: false });

/* ═══════════════════════════════════════════════════════════
   14. MAIN LOOP
   ═══════════════════════════════════════════════════════════ */
let last = performance.now();

function frame(now) {
  requestAnimationFrame(frame);

  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0)    dt = 0;

  if (running && !paused && !gameOver) update(dt);

  renderWorld();
  ctx.putImageData(imgData, 0, 0);
  drawWeapon();
  drawMinimap();

  hitEl.style.opacity = hitMarker > 0 ? '1' : '0';
  flashEl.style.opacity = (damageFlash * 0.35).toFixed(3);
}

/* ═══════════════════════════════════════════════════════════
   15. BOOT
   ═══════════════════════════════════════════════════════════ */
spawnEntities();
updateHUD();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>

function renderWorld(){
  const area = areaAt(player.x);
  drawSky(area);
  drawParallax(area, camX);
  CTX.save();
  CTX.translate(-Math.round(camX), 0);
  drawGround();
  drawProps(area);
  for(const n of npcs) if(Math.abs(n.x-camX) < W+60) drawNPC(n);
  for(const pk of pickups) if(Math.abs(pk.x-camX) < W+60) drawPickup(pk);
  for(const e of enemies) drawEnemy(e);
  for(const b of bossList) drawBoss(b);
  for(const pr of projectiles){
    CTX.save(); CTX.globalCompositeOperation = 'lighter';
    if(pr.kind === 'wave'){
      addGlow(pr.x, pr.y, pr.w*1.4, pr.color, 0.7);
      CTX.globalAlpha = 0.85; CTX.fillStyle = pr.color;
      CTX.beginPath(); CTX.ellipse(pr.x, pr.y, pr.w*0.8, pr.h*0.8, 0, 0, 7); CTX.fill();
      CTX.fillStyle = '#ffffff';
      CTX.beginPath(); CTX.ellipse(pr.x, pr.y, pr.w*0.4, pr.h*0.4, 0, 0, 7); CTX.fill();
    } else {
      addGlow(pr.x, pr.y, pr.w*2.2, pr.color, 0.7);
      CTX.globalAlpha = 0.9; CTX.fillStyle = pr.color;
      CTX.beginPath(); CTX.arc(pr.x, pr.y, pr.w, 0, 7); CTX.fill();
      CTX.fillStyle = '#ffffff';
      CTX.beginPath(); CTX.arc(pr.x, pr.y, pr.w*0.4, 0, 7); CTX.fill();
    }
    CTX.restore();
  }
  if(player.alive || game.state === 'dead') drawPlayer();
  drawParticles(false);
  drawParticles(true);
  for(const d of game.damageNums){
    const a = Math.min(1, d.life*3);
    CTX.globalAlpha = a;
    drawText(String(Math.round(d.dmg)), d.x + Math.sin(d.life*20)*2, d.y, d.big?'#ffd98a':'#ffffff', d.big?2:1, '#000');
    CTX.globalAlpha = 1;
  }
  CTX.restore();
  drawAtmosphere(area);
  drawPost(area);
}

function drawAtmosphere(area){
  const pal = PALETTES[area];
  for(let i=0;i<3;i++){
    const y = 150 + i*30 + Math.sin(game.t*0.4 + i)*8;
    const grad = CTX.createLinearGradient(0, y-15, 0, y+15);
    grad.addColorStop(0, withA(pal.fogColor, 0));
    grad.addColorStop(0.5, withA(pal.fogColor, 0.08));
    grad.addColorStop(1, withA(pal.fogColor, 0));
    CTX.fillStyle = grad;
    CTX.fillRect(0, y-15, W, 30);
  }
  if(area === 0){
    CTX.save(); CTX.globalCompositeOperation = 'lighter';
    for(let i=0;i<20;i++){
      const t = game.t*0.5 + i*3.7;
      const x = ((t*30 + i*71) % (W+40)) - 20;
      const y = 120 + Math.sin(t*1.4 + i*2)*60;
      CTX.globalAlpha = 0.4 + Math.sin(t*3 + i)*0.3;
      CTX.fillStyle = '#ffe9a8';
      CTX.fillRect(Math.round(x), Math.round(y), 2, 2);
    }
    CTX.restore();
    for(let i=0;i<15;i++){
      const t = game.t*0.6 + i*5.3;
      const x = ((t*50) % (W+80)) - 40;
      const y = ((t*35 + i*23) % (H+40)) - 20;
      CTX.save();
      CTX.translate(Math.round(x), Math.round(y));
      CTX.rotate(t*0.5 + i);
      CTX.globalAlpha = 0.5;
      CTX.fillStyle = '#c84a3a';
      CTX.fillRect(-2, -1, 4, 2);
      CTX.restore();
    }
  } else if(area === 1){
    CTX.save(); CTX.globalCompositeOperation = 'lighter';
    for(let i=0;i<26;i++){
      const t = game.t*0.4 + i*4.7;
      const x = ((t*25 + i*57) % (W+40)) - 20;
      const y = 60 + ((t*18 + i*43) % 160);
      CTX.globalAlpha = 0.5 + Math.sin(t*2 + i)*0.35;
      CTX.fillStyle = '#a8ffd8';
      CTX.fillRect(Math.round(x), Math.round(y), 2, 2);
    }
    CTX.restore();
  } else if(area === 2){
    CTX.save(); CTX.globalCompositeOperation = 'lighter';
    for(let i=0;i<24;i++){
      const t = game.t*0.35 + i*4.7;
      const x = ((t*20 + i*57) % (W+40)) - 20;
      const y = 60 + ((t*18 + i*43) % 160);
      CTX.globalAlpha = 0.4 + Math.sin(t*2)*0.3;
      CTX.fillStyle = '#d76bff';
      CTX.fillRect(Math.round(x), Math.round(y), 2, 2);
    }
    CTX.restore();
  } else if(area === 3){
    CTX.save(); CTX.globalCompositeOperation = 'lighter';
    for(let i=0;i<36;i++){
      const t = game.t*0.7 + i*5.1;
      const x = ((t*25 + i*61) % (W+40)) - 20;
      const y = H - ((t*45 + i*31) % (H+40));
      CTX.globalAlpha = 0.4 + Math.sin(t*3 + i)*0.35;
      CTX.fillStyle = i%3 ? '#ff8a3d' : '#ffd08a';
      CTX.fillRect(Math.round(x), Math.round(y), 2, 2);
    }
    CTX.restore();
  } else {
    CTX.save(); CTX.globalCompositeOperation = 'lighter';
    for(let i=0;i<30;i++){
      const t = game.t*0.5 + i*5.1;
      const x = ((t*22 + i*61) % (W+40)) - 20;
      const y = ((t*30 + i*31) % (H+40)) - 20;
      CTX.globalAlpha = 0.4 + Math.sin(t*3 + i)*0.3;
      CTX.fillStyle = i%2 ? '#ff2a5a' : '#ff8aaa';
      CTX.fillRect(Math.round(x), Math.round(y), 2, 2);
    }
    CTX.restore();
    if(Math.random() < 0.003){ game.flash = 0.15; game.flashColor = '#ff2a5a'; }
  }
  if(game.flash > 0){
    CTX.globalAlpha = Math.min(0.75, game.flash);
    CTX.fillStyle = game.flashColor;
    CTX.fillRect(0,0,W,H);
    CTX.globalAlpha = 1;
  }
  if(player.ultimateTime > 0){
    CTX.globalAlpha = 0.55;
    CTX.fillStyle = '#000';
    CTX.fillRect(0,0,W,H);
    CTX.globalAlpha = 1;
  }
}

function drawPost(area){
  const g = CTX.createRadialGradient(W/2, H/2, 120, W/2, H/2, 320);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.6)');

  CTX.fillRect(0,0,W,H);

    'rgba(60,80,160,0.06)','rgba(40,120,100,0.06)','rgba(120,60,180,0.07)',
    'rgba(180,60,30,0.07)','rgba(180,20,60,0.09)'
  ];
  CTX.fillStyle = grades[area];
  CTX.fillRect(0,0,W,H);
}

  CTX.fillRect(x+w-1, y, 1, 4);

function drawDialogue(){

    CTX.fillRect(W-30, H-22, 6, 2);
    CTX.fillRect(W-28, H-20, 2, 4);
    CTX.fillRect(W-30, H-16, 6, 2);
  }
}

  const px = mx + (clamp(player.x,0,WORLD_W)/WORLD_W)*mw;
  CTX.fillStyle = '#ffffff';
  CTX.beginPath();
  CTX.moveTo(px, my-6); CTX.lineTo(px-4, my-13); CTX.lineTo(px+4, my-13);
  CTX.closePath(); CTX.fill();
  CTX.fillStyle = '#ff2a5a'; CTX.fillRect(px-1, my-12, 2, 2);
  for(let i=0;i<AREAS.length;i++){
    drawText(AREAS[i].name, mx, my+36+i*12, (player.x>=AREAS[i].x0&&player.x<AREAS[i].x1) ? '#ffd98a' : '#5a6480', 1);
  }
  drawTextCenter('M OR ESC TO CLOSE', H-14, '#5a6480', 1, '#000');
}

function drawDead(){
  CTX.fillStyle = 'rgba(20,0,0,0.55)'; CTX.fillRect(0,0,W,H);
  drawTextCenter('YOU HAVE FALLEN', 100, '#ff3a4a', 3, '#000');
  if(game.deathTimer > 1.0){
    CTX.globalAlpha = 0.6+Math.sin(game.t*4)*0.4;
    drawTextCenter('PRESS ENTER TO RISE AGAIN', 150, '#ffd98a', 1, '#000');
    CTX.globalAlpha = 1;
    drawTextCenter('ESC TO RETURN TO TITLE', 166, '#5a6480', 1, '#000');
  }
}

function drawVictory(){
  const g = CTX.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0414'); g.addColorStop(1,'#2a0a2a');
  CTX.fillStyle = g; CTX.fillRect(0,0,W,H);
  for(let i=0;i<70;i++){
    const t = game.t*0.6 + i*3.7;
    const x = ((t*30 + i*71) % (W+40)) - 20;
    const y = ((t*20 + i*47) % (H+40)) - 20;
    CTX.globalAlpha = 0.4 + Math.sin(t*3)*0.3;
    CTX.fillStyle = i%2 ? '#ffd98a' : '#8fd6ff';
    CTX.fillRect(Math.round(x), Math.round(y), 2, 2);
  }
  CTX.globalAlpha = 1;
  CTX.fillStyle = 'rgba(0,0,0,0.5)'; CTX.fillRect(0, 40, W, 60);
  drawTextCenter('THE ECLIPSE IS BROKEN', 56, '#ffd98a', 2, '#000');
  drawTextCenter('THE MOON REMEMBERS ITS LIGHT', 84, '#e6e6ff', 1, '#000');
  drawTextCenter('THE FORGOTTEN BLADE IS NAMED AT LAST', 102, '#c8a24a', 1, '#000');
  if(game.victoryTimer > 2){
    CTX.globalAlpha = 0.6+Math.sin(game.t*4)*0.4;
    drawTextCenter('PRESS ENTER TO RETURN TO TITLE', 180, '#8fd6ff', 1, '#000');
    CTX.globalAlpha = 1;
  }
}

/* ------------------------------------------------------------- WORLD TICK */
function updateWorldObjects(dt){
  if(hit('KeyE')){
    for(const n of npcs){
      if(Math.abs(n.x-player.x)<40 && Math.abs(n.y-player.y)<40){
        showDialogue(n.name, n.lines, null); return;
      }
    }
  }
  updatePickups();
  const a = areaAt(player.x);
  if(a !== game.areaShown){ game.areaShown = a; game.areaBanner = 2.6; }
  game.areaBanner = Math.max(0, game.areaBanner - dt);
  for(const ar of ARENAS){
    if(ar.triggered) continue;
    if(player.x > ar.x0 && player.x < ar.x1){
      const b = bosses[ar.bossId];
      if(b && !b.dead && !b.active){ ar.triggered = true; activateBoss(b); }
    }
  }
}

/* --------------------------------------------------------------- GAME FLOW */
function startNewGame(){
  player.x = 80; player.y = 224; player.vx = 0; player.vy = 0;
  player.hp = 100; player.maxHp = 100; player.energy = 30;
  player.alive = true; player.deathTime = 0; player.checkpoint = 80;
  player.unlocked = { water:true, flame:false, lightning:false, wind:false };
  player.element = 'water'; player.attack = null;
  player.dashTime = 0; player.dashCd = 0; player.invuln = 0;
  player.ultimateTime = 0; player.castTime = 0; player.landSquash = 0;
  flags.flame = flags.lightning = flags.wind = false;
  flags.hpUpgrades = 0; flags.boss1 = flags.boss2 = false; flags.lore = {};
  ARENAS.forEach(a=>a.triggered = false);
  initWorldObjects(); initBosses(); spawnEnemies();
  for(let i=0;i<P_MAX;i++) particles[i].life = 0;
  projectiles.length = 0; game.damageNums.length = 0;
  game.comboCount = 0; game.state = 'play';
  game.areaShown = -1; game.areaBanner = 0; camX = 0;
  toast('THE LANTERNS STILL BURN');
}
function saveGame(){
  try{
    const data = {
      hp:player.hp, maxHp:player.maxHp, energy:player.energy,
      x:player.x, y:player.y, checkpoint:player.checkpoint,
      unlocked:player.unlocked, element:player.element,
      flags:flags, areas:ARENAS.map(a=>a.triggered),
      enemies:enemies.filter(e=>e.dead).map(e=>e.type+'_'+Math.round(e.x)),
      pickups:pickups.filter(p=>p.taken).map(p=>p.x),
      boss1hp:bosses.samurai?bosses.samurai.hp:420,
      boss2hp:bosses.wraith?bosses.wraith.hp:620,
      boss1dead:bosses.samurai?bosses.samurai.dead:false,
      boss2dead:bosses.wraith?bosses.wraith.dead:false
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    toast('GAME SAVED');
  }catch(e){ toast('SAVE FAILED'); }
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    initWorldObjects(); initBosses(); spawnEnemies();
    player.hp = d.hp; player.maxHp = d.maxHp; player.energy = d.energy;
    player.x = d.x; player.y = d.y; player.checkpoint = d.checkpoint;
    player.unlocked = d.unlocked; player.element = d.element || 'water';
    player.alive = true; player.deathTime = 0;
    player.attack = null; player.dashTime = 0; player.ultimateTime = 0; player.castTime = 0;
    Object.assign(flags, d.flags || {});
    if(d.areas) ARENAS.forEach((a,i)=> a.triggered = !!d.areas[i]);
    if(d.pickups) for(const pk of pickups) if(d.pickups.includes(pk.x)) pk.taken = true;
    for(const key of (d.enemies||{})){
      for(const e of enemies){
        if(e.dead) continue;
        if((e.type+'_'+Math.round(e.x)) === key){ e.alive = false; e.dead = true; e.deathTime = 2; }
      }
    }
    if(bosses.samurai){ bosses.samurai.hp = d.boss1hp; bosses.samurai.dead = d.boss1dead; }
    if(bosses.wraith){ bosses.wraith.hp = d.boss2hp; bosses.wraith.dead = d.boss2dead; }
    for(let i=0;i<P_MAX;i++) particles[i].life = 0;
    projectiles.length = 0;
    game.state = 'play'; game.areaShown = -1;
    camX = clamp(player.x - W/2, 0, WORLD_W-W);
    toast('JOURNEY RESUMED');
    return true;
  }catch(e){ return false; }
}

/* ------------------------------------------------------------------- LOOP */
let lastT = 0;
function loop(ts){
  requestAnimationFrame(loop);
  const rawDt = Math.min(0.05, (ts-lastT)/1000 || 0.016);
  lastT = ts;
  update(rawDt);
  render();
  updateTouchVisibility();
  clearPressed();
}

function update(rawDt){
  game.t += rawDt;
  game.toastTimer = Math.max(0, game.toastTimer - rawDt);
  game.flash = Math.max(0, game.flash - rawDt*2.2);
  game.shake = Math.max(0, game.shake - rawDt*22);
  game.comboTimer = Math.max(0, game.comboTimer - rawDt);
  if(game.comboTimer <= 0) game.comboCount = 0;
  if(game.shake > 0){ game.shakeX = rnd(-game.shake, game.shake); game.shakeY = rnd(-game.shake, game.shake); }
  else { game.shakeX = 0; game.shakeY = 0; }
  for(let i=game.damageNums.length-1;i>=0;i--){
    const d = game.damageNums[i];
    d.life -= rawDt; d.y += d.vy*rawDt;
    if(d.life <= 0) game.damageNums.splice(i,1);
  }

  if(game.state === 'title'){ handleTitleInput(); return; }
  if(game.state === 'dialogue'){
    if(hit('KeyE','Enter','Space','KeyJ')){ advanceDialogue(); sfx('menu'); }
    if(hit('Escape')){ dialogue.active = false; game.state = 'play'; }
    return;
  }
  if(game.state === 'pause'){ handlePauseInput(); return; }
  if(game.state === 'inventory'){ if(hit('KeyI','Escape','KeyJ')){ game.state = 'play'; sfx('menu'); } return; }
  if(game.state === 'map'){ if(hit('KeyM','Escape','KeyJ')){ game.state = 'play'; sfx('menu'); } return; }
  if(game.state === 'dead'){
    game.deathTimer += rawDt;
    updateParticles(rawDt*0.5);
    if(game.deathTimer > 1.0 && hit('Enter','KeyJ')){
      player.alive = true; player.hp = player.maxHp; player.energy = 30;
      player.x = player.checkpoint; player.y = 200; player.vx = 0; player.vy = 0;
      player.invuln = 1.5; player.deathTime = 0;
      for(let i=0;i<P_MAX;i++) particles[i].life = 0;
      projectiles.length = 0;
      for(const b of bossList) if(!b.dead){ b.active=false; b.hp=b.maxHp; b.state='idle'; b.phase=1; b.intro=0; }
      for(const ar of ARENAS){ const b = bosses[ar.bossId]; if(b && !b.dead) ar.triggered = false; }
      game.state = 'play'; game.comboCount = 0;
    }
    if(hit('Escape')){ game.state = 'title'; game.menu='main'; game.menuIndex=0; }
    return;
  }
  if(game.state === 'victory'){
    game.victoryTimer += rawDt;
    updateParticles(rawDt);
    if(game.victoryTimer > 2 && hit('Enter','KeyJ')){ game.state='title'; game.menu='main'; game.menuIndex=0; }
    return;
  }

  if(hit('Escape')){ game.state='pause'; game.menuIndex=0; sfx('menu'); return; }
  if(hit('KeyI')){ game.state='inventory'; sfx('menu'); return; }
  if(hit('KeyM')){ game.state='map'; sfx('menu'); return; }
  if(game.hitstop > 0){ game.hitstop -= rawDt; return; }
  if(game.slowmo > 0) game.slowmo -= rawDt;
  else if(player.ultimateTime <= 0) game.timeScale = 1;

  const dt = rawDt * game.timeScale;
  updatePlayer(dt);
  updateEnemies(dt);
  updateBosses(dt);
  updateProjectiles(dt);
  updateWorldObjects(dt);
  updateParticles(dt);

  const targetCam = clamp(player.x - W/2 + player.facing * 20, 0, WORLD_W - W);
  camX = lerp(camX, targetCam, Math.min(1, rawDt*7));

  if(flags.boss2 && bosses.wraith && bosses.wraith.dead && bosses.wraith.deathTime > 2.5){
    if(game.state === 'play'){ game.state='victory'; game.victoryTimer=0; }
  }
  if(game.timeScale < 1 && player.ultimateTime <= 0 && game.slowmo <= 0) game.timeScale = 1;
}

/* ------------------------------------------------------------ MENU INPUT */
function handleTitleInput(){
  if(game.menu === 'settings'){
    if(hit('ArrowLeft','KeyA')){ volumes.master = clamp(volumes.master-0.1,0,1); applyVolumes(); sfx('menu'); }
    if(hit('ArrowRight','KeyD')){ volumes.master = clamp(volumes.master+0.1,0,1); applyVolumes(); sfx('menu'); }
    if(hit('Escape','Enter')){ game.menu='main'; game.menuIndex=0; sfx('menu'); }
    return;
  }
  if(game.menu === 'controls'){
    if(hit('Escape','Enter','KeyJ')){ game.menu='main'; game.menuIndex=0; sfx('menu'); }
    return;
  }
  if(hit('KeyW','ArrowUp')){ game.menuIndex = (game.menuIndex-1+4)%4; sfx('menu'); }
  if(hit('KeyS','ArrowDown')){ game.menuIndex = (game.menuIndex+1)%4; sfx('menu'); }
  if(hit('Enter','Space','KeyJ')){
    sfx('menu');
    if(game.menuIndex === 0) startNewGame();
    else if(game.menuIndex === 1){ if(!loadGame()) toast('NO SAVE DATA'); if(game.state !== 'play') startNewGame(); }
    else if(game.menuIndex === 2) game.menu = 'controls';
    else if(game.menuIndex === 3) game.menu = 'settings';
  }
}
function applyVolumes(){
  if(masterGain) masterGain.gain.value = volumes.master;
  if(sfxGain) sfxGain.gain.value = volumes.sfx;
  if(musicGain) musicGain.gain.value = volumes.music;
}
function handlePauseInput(){
  if(hit('KeyW','ArrowUp')){ game.menuIndex = (game.menuIndex-1+6)%6; sfx('menu'); }
  if(hit('KeyS','ArrowDown')){ game.menuIndex = (game.menuIndex+1)%6; sfx('menu'); }
  if(hit('Enter','Space','KeyJ')){
    sfx('menu');
    if(game.menuIndex === 0) game.state = 'play';
    else if(game.menuIndex === 1) game.state = 'inventory';
    else if(game.menuIndex === 2) game.state = 'map';
    else if(game.menuIndex === 3){ game.state='title'; game.menu='settings'; game.menuIndex=0; }
    else if(game.menuIndex === 4) saveGame();
    else if(game.menuIndex === 5){ game.state='title'; game.menu='main'; game.menuIndex=0; }
  }
  if(hit('Escape')) game.state = 'play';
}

/* ---------------------------------------------------------------- RENDER */
function render(){
  CTX.setTransform(1,0,0,1,0,0);
  CTX.fillStyle = '#000'; CTX.fillRect(0,0,W,H);
  if(game.state === 'title'){ drawTitle(); return; }
  if(game.state === 'victory'){ drawVictory(); return; }
  CTX.save();
  CTX.translate(Math.round(game.shakeX), Math.round(game.shakeY));
  renderWorld();
  CTX.restore();
  if(game.state === 'play' || game.state === 'dead') drawHUD();
  for(const b of bossList){
    if(b.active && b.intro > 0 && !b.dead){
      const k = 1 - b.intro/2.4;
      CTX.fillStyle = 'rgba(0,0,0,' + (0.5*Math.sin(k*Math.PI)) + ')';
      CTX.fillRect(0,0,W,H);
      CTX.globalAlpha = Math.min(1, b.intro*1.2);
      drawTextCenter('A PRESENCE AWAKENS', 110, '#ff6a6a', 1, '#000');
      CTX.globalAlpha = 1;
    }
  }
  if(game.state === 'dialogue') drawDialogue();
  if(game.state === 'pause') drawPause();
  if(game.state === 'inventory') drawInventory();
  if(game.state === 'map') drawMap();
  if(game.state === 'dead') drawDead();
}

/* ------------------------------------------------------------------ INIT */
initWorldObjects();
initBosses();
spawnEnemies();
initTouchControls();
document.addEventListener('touchstart', initAudio, {once:true, passive:true});
requestAnimationFrame(loop);
</script>
</body>

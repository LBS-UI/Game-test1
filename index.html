<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#02020a">
<title>ECLIPSE: BLADE OF THE FORGOTTEN</title>
<style>
  html,body{
    margin:0;padding:0;height:100%;background:#02020a;overflow:hidden;
    touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  body{display:flex;align-items:center;justify-content:center;font-family:monospace;}
  canvas{
    image-rendering:pixelated;image-rendering:crisp-edges;display:block;
    box-shadow:0 0 80px rgba(160,60,220,.35),0 0 200px rgba(255,42,90,.15);
  }

  /* ==================== TOUCH CONTROLS ==================== */
  #touch-controls{
    position:fixed;inset:0;pointer-events:none;display:none;z-index:100;
    touch-action:none;-webkit-user-select:none;user-select:none;
  }
  #touch-controls.active{display:block;}
  .touch-btn{
    position:absolute;pointer-events:auto;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(60,80,120,0.55), rgba(15,20,40,0.75));
    border:2px solid rgba(200,160,80,0.55);
    color:#ffd98a;font-family:monospace;font-weight:bold;
    display:flex;align-items:center;justify-content:center;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;touch-action:none;
    padding:0;cursor:pointer;
    transition:transform 0.04s, background 0.04s, box-shadow 0.04s;
    box-shadow:0 0 8px rgba(255,100,150,0.25), inset 0 0 8px rgba(255,200,100,0.08);
    text-shadow:1px 1px 2px #000;
    font-size:2.6vmin;line-height:1;
    z-index:101;
  }
  .touch-btn.pressed{
    background:radial-gradient(circle at 30% 30%, rgba(255,120,160,0.9), rgba(180,40,80,0.95));
    border-color:#ff9ab0;transform:scale(0.92);
    box-shadow:0 0 16px rgba(255,100,150,0.8), inset 0 0 12px rgba(255,200,200,0.3);
  }
  .touch-btn.small{font-size:2vmin;}

  /* Safe-area aware positioning helpers */
  .tl{top:calc(3vmin + env(safe-area-inset-top,0px));}
  .tr{top:calc(3vmin + env(safe-area-inset-top,0px));}
  .bl{bottom:calc(3vmin + env(safe-area-inset-bottom,0px));}
  .br{bottom:calc(3vmin + env(safe-area-inset-bottom,0px));}

  /* Landscape warning for portrait phones */
  #rotate-hint{
    position:fixed;inset:0;display:none;z-index:200;
    background:rgba(2,3,10,0.96);color:#ffd98a;font-family:monospace;
    align-items:center;justify-content:center;flex-direction:column;
    text-align:center;font-size:14px;padding:20px;
  }
  #rotate-hint.active{display:flex;}
  @media (orientation:portrait){
    #touch-controls.active ~ #rotate-hint{display:flex;}
  }
</style>
</head>
<body>
<canvas id="game" width="480" height="270"></canvas>

<!-- Touch Controls Overlay -->
<div id="touch-controls">
  <!-- Top-left: fullscreen -->
  <button class="touch-btn small tl" id="btn-fs" style="left:calc(3vmin + env(safe-area-inset-left,0px));width:8vmin;height:8vmin;">FS</button>

  <!-- Top-right utility: Pause / Interact / Cycle Element -->
  <button class="touch-btn small tr" id="btn-pause" style="right:calc(3vmin + env(safe-area-inset-right,0px));width:9vmin;height:9vmin;">II</button>
  <button class="touch-btn small tr" data-key="KeyE" style="right:calc(14vmin + env(safe-area-inset-right,0px));width:9vmin;height:9vmin;">E</button>
  <button class="touch-btn small tr" id="btn-el" style="right:calc(25vmin + env(safe-area-inset-right,0px));width:9vmin;height:9vmin;">EL</button>

  <!-- Bottom-left: movement -->
  <button class="touch-btn bl" data-key="KeyA" style="left:calc(3vmin + env(safe-area-inset-left,0px));width:12vmin;height:12vmin;">&#9664;</button>
  <button class="touch-btn bl" data-key="KeyD" style="left:calc(17vmin + env(safe-area-inset-left,0px));width:12vmin;height:12vmin;">&#9654;</button>
  <button class="touch-btn bl" data-key="KeyW" style="left:calc(10vmin + env(safe-area-inset-left,0px));bottom:calc(17vmin + env(safe-area-inset-bottom,0px));width:12vmin;height:12vmin;">&#9650;</button>

  <!-- Bottom-right: combat cluster -->
  <button class="touch-btn br" data-key="KeyJ" style="right:calc(3vmin + env(safe-area-inset-right,0px));width:14vmin;height:14vmin;">J</button>
  <button class="touch-btn br" data-key="ShiftLeft" style="right:calc(19vmin + env(safe-area-inset-right,0px));width:11vmin;height:11vmin;">DSH</button>
  <button class="touch-btn br" data-key="KeyK" style="right:calc(32vmin + env(safe-area-inset-right,0px));width:11vmin;height:11vmin;">K</button>
  <button class="touch-btn br" data-key="KeyL" style="right:calc(3vmin + env(safe-area-inset-right,0px));bottom:calc(19vmin + env(safe-area-inset-bottom,0px));width:11vmin;height:11vmin;">L</button>
  <button class="touch-btn br" data-key="KeyU" style="right:calc(16vmin + env(safe-area-inset-right,0px));bottom:calc(19vmin + env(safe-area-inset-bottom,0px));width:10vmin;height:10vmin;">U</button>
  <button class="touch-btn br" data-key="KeyS" style="right:calc(28vmin + env(safe-area-inset-right,0px));bottom:calc(19vmin + env(safe-area-inset-bottom,0px));width:10vmin;height:10vmin;">S</button>
</div>

<div id="rotate-hint">
  <div style="font-size:24px;margin-bottom:8px;">&#8635;</div>
  <div>PLEASE ROTATE YOUR DEVICE</div>
  <div style="margin-top:8px;font-size:12px;color:#8a94b0;">Landscape mode recommended for best experience</div>
</div>

<script>
"use strict";
/* ===========================================================================
   ECLIPSE: BLADE OF THE FORGOTTEN  —  Mobile Edition
   ========================================================================= */

const W = 480, H = 270;
const GRAV = 1000;
const WORLD_W = 7100;
const SAVE_KEY = 'eclipse_blade_save_v1';

const CV = document.getElementById('game');
const CTX = CV.getContext('2d');
CTX.imageSmoothingEnabled = false;

/* -------------------------------------------------------------- TOUCH DETECT */
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
let touchEnabled = false;

function resizeCanvas(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  CV.style.width  = Math.floor(W * s) + 'px';
  CV.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 250));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', resizeCanvas);
}
resizeCanvas();

/* -------------------------------------------------------------------- UTILS */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const rnd   = (a,b)=> a+Math.random()*(b-a);
const sign  = v => v<0?-1:(v>0?1:0);
function aabb(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function hash(n){ n=(n<<13)^n; return ((n*(n*n*15731+789221)+1373162589)&0x7fffffff)/0x7fffffff; }
function withA(hex,a){
  if(hex[0] !== '#') return hex;
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function mixHex(c1,c2,t){
  const r1=parseInt(c1.slice(1,3),16),g1=parseInt(c1.slice(3,5),16),b1=parseInt(c1.slice(5,7),16);
  const r2=parseInt(c2.slice(1,3),16),g2=parseInt(c2.slice(3,5),16),b2=parseInt(c2.slice(5,7),16);
  return '#'+((Math.round(lerp(r1,r2,t))<<16)|(Math.round(lerp(g1,g2,t))<<8)|Math.round(lerp(b1,b2,t))).toString(16).padStart(6,'0');
}

/* --------------------------------------------------------- PIXEL TEXT FONT */
const FONT = {
 'A':'01110|10001|10001|11111|10001|10001|10001','B':'11110|10001|10001|11110|10001|10001|11110',
 'C':'01110|10001|10000|10000|10000|10001|01110','D':'11110|10001|10001|10001|10001|10001|11110',
 'E':'11111|10000|10000|11110|10000|10000|11111','F':'11111|10000|10000|11110|10000|10000|10000',
 'G':'01110|10001|10000|10111|10001|10001|01111','H':'10001|10001|10001|11111|10001|10001|10001',
 'I':'11111|00100|00100|00100|00100|00100|11111','J':'00111|00010|00010|00010|00010|10010|01100',
 'K':'10001|10010|10100|11000|10100|10010|10001','L':'10000|10000|10000|10000|10000|10000|11111',
 'M':'10001|11011|10101|10101|10001|10001|10001','N':'10001|11001|10101|10011|10001|10001|10001',
 'O':'01110|10001|10001|10001|10001|10001|01110','P':'11110|10001|10001|11110|10000|10000|10000',
 'Q':'01110|10001|10001|10001|10101|10010|01101','R':'11110|10001|10001|11110|10100|10010|10001',
 'S':'01111|10000|10000|01110|00001|00001|11110','T':'11111|00100|00100|00100|00100|00100|00100',
 'U':'10001|10001|10001|10001|10001|10001|01110','V':'10001|10001|10001|10001|10001|01010|00100',
 'W':'10001|10001|10001|10101|10101|11011|10001','X':'10001|10001|01010|00100|01010|10001|10001',
 'Y':'10001|10001|01010|00100|00100|00100|00100','Z':'11111|00001|00010|00100|01000|10000|11111',
 '0':'01110|10001|10011|10101|11001|10001|01110','1':'00100|01100|00100|00100|00100|00100|01110',
 '2':'01110|10001|00001|00010|00100|01000|11111','3':'11111|00010|00100|00010|00001|10001|01110',
 '4':'00010|00110|01010|10010|11111|00010|00010','5':'11111|10000|11110|00001|00001|10001|01110',
 '6':'00110|01000|10000|11110|10001|10001|01110','7':'11111|00001|00010|00100|01000|01000|01000',
 '8':'01110|10001|10001|01110|10001|10001|01110','9':'01110|10001|10001|01111|00001|00010|01100',
 ':':'00000|00100|00000|00000|00100|00000|00000','.':'00000|00000|00000|00000|00000|00100|00000',
 ',':'00000|00000|00000|00000|00100|00100|01000','!':'00100|00100|00100|00100|00100|00000|00100',
 '?':'01110|10001|00001|00010|00100|00000|00100','-':'00000|00000|00000|11111|00000|00000|00000',
 '+':'00000|00100|00100|11111|00100|00100|00000',"'":'00100|00100|00000|00000|00000|00000|00000',
 '/':'00001|00010|00010|00100|01000|01000|10000','(':'00010|00100|01000|01000|01000|00100|00010',
 ')':'01000|00100|00010|00010|00010|00100|01000','*':'00000|10101|01110|11111|01110|10101|00000',
 ' ':'00000|00000|00000|00000|00000|00000|00000'
};
const FONT_CACHE = {};
function glyph(ch){ if(!FONT_CACHE[ch]) FONT_CACHE[ch] = (FONT[ch]||FONT[' ']).split('|'); return FONT_CACHE[ch]; }
function textWidth(s, scale){ return String(s).length * 6 * (scale||1); }
function drawTextRaw(str, x, y, color, scale){
  CTX.fillStyle = color;
  let cx = Math.round(x); const cy = Math.round(y);
  for(let i=0;i<str.length;i++){
    const rows = glyph(str[i]);
    for(let r=0;r<7;r++){ const row = rows[r];
      for(let c=0;c<5;c++) if(row[c]==='1') CTX.fillRect(cx+c*scale, cy+r*scale, scale, scale);
    }
    cx += 6*scale;
  }
}
function drawText(str, x, y, color, scale, shadow){
  scale = scale||1; str = String(str).toUpperCase();
  if(shadow){ drawTextRaw(str, x+scale, y+scale, shadow, scale); drawTextRaw(str, x-scale, y+scale, shadow, scale); }
  drawTextRaw(str, x, y, color, scale);
}
function drawTextCenter(str, y, color, scale, shadow){
  scale = scale||1;
  const w = textWidth(String(str).toUpperCase(), scale);
  drawText(str, Math.round((W-w)/2), y, color, scale, shadow);
}

/* -------------------------------------------------------------------- INPUT */
const keys = {}, pressed = {};
window.addEventListener('keydown', e=>{
  const c = e.code;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(c)) e.preventDefault();
  if(!keys[c]) pressed[c] = true;
  keys[c] = true;
  initAudio();
  if(c==='KeyF') toggleFullscreen();
});
window.addEventListener('keyup', e=>{ keys[e.code] = false; });
window.addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });
window.addEventListener('contextmenu', e=> e.preventDefault());

function down(...c){ for(const k of c) if(keys[k]) return true; return false; }
function hit(...c){ for(const k of c) if(pressed[k]) return true; return false; }
function clearPressed(){ for(const k in pressed) delete pressed[k]; }
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  } else document.exitFullscreen().catch(()=>{});
}

/* ================================================================== TOUCH */
function initTouchControls(){
  if(!IS_TOUCH) return;
  touchEnabled = true;
  const tc = document.getElementById('touch-controls');
  tc.classList.add('active');

  // Wire each button with data-key to its keyboard key
  document.querySelectorAll('.touch-btn[data-key]').forEach(btn=>{
    const code = btn.dataset.key;
    const press = (e)=>{
      e.preventDefault();
      initAudio();
      if(!keys[code]) pressed[code] = true;
      keys[code] = true;
      btn.classList.add('pressed');
    };
    const release = (e)=>{
      if(e) e.preventDefault();
      keys[code] = false;
      btn.classList.remove('pressed');
    };
    btn.addEventListener('touchstart', press, {passive:false});
    btn.addEventListener('touchend', release, {passive:false});
    btn.addEventListener('touchcancel', release, {passive:false});
    // Desktop testing fallback
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
  });

  // Pause button
  const pauseBtn = document.getElementById('btn-pause');
  pauseBtn.addEventListener('touchstart', e=>{
    e.preventDefault(); initAudio();
    pressed['Escape'] = true;
    pauseBtn.classList.add('pressed');
  }, {passive:false});
  pauseBtn.addEventListener('touchend', ()=> pauseBtn.classList.remove('pressed'));

  // Fullscreen button
  const fsBtn = document.getElementById('btn-fs');
  fsBtn.addEventListener('touchstart', e=>{
    e.preventDefault(); initAudio();
    toggleFullscreen();
    fsBtn.classList.add('pressed');
  }, {passive:false});
  fsBtn.addEventListener('touchend', ()=> fsBtn.classList.remove('pressed'));

  // Element cycle button
  const elBtn = document.getElementById('btn-el');
  elBtn.addEventListener('touchstart', e=>{
    e.preventDefault(); initAudio();
    cycleElement();
    elBtn.classList.add('pressed');
  }, {passive:false});
  elBtn.addEventListener('touchend', ()=> elBtn.classList.remove('pressed'));

  // Canvas tap handler for menus
  CV.addEventListener('touchstart', e=>{
    e.preventDefault(); initAudio();
    const rect = CV.getBoundingClientRect();
    for(const t of e.changedTouches){
      const gx = (t.clientX - rect.left) / rect.width * W;
      const gy = (t.clientY - rect.top) / rect.height * H;
      handleCanvasTap(gx, gy);
    }
  }, {passive:false});
}

function cycleElement(){
  const order = ['water','flame','lightning','wind'];
  let idx = order.indexOf(player.element);
  for(let i=0; i<4; i++){
    idx = (idx + 1) % 4;
    if(player.unlocked[order[idx]]){
      player.element = order[idx];
      toast(ELEMENTS[player.element].name);
      sfx('menu');
      return;
    }
  }
}

function handleCanvasTap(gx, gy){
  // Called for touchstart on the canvas in menu states
  if(game.state === 'title'){
    if(game.menu === 'main'){
      // 4 items at y=182,198,214,230
      if(gx > W/2 - 70 && gx < W/2 + 70){
        for(let i=0;i<4;i++){
          const my = 182 + i*16;
          if(gy >= my-4 && gy < my+12){
            game.menuIndex = i;
            pressed['Enter'] = true;
            sfx('menu');
            return;
          }
        }
      }
    } else if(game.menu === 'settings'){
      // Volume bar y=192-198, x=W/2-40 to W/2+40
      if(gy >= 188 && gy <= 204 && gx > W/2-44 && gx < W/2+44){
        volumes.master = clamp((gx - (W/2-40)) / 80, 0, 1);
        applyVolumes();
        sfx('menu');
        return;
      }
      // Back to menu
      pressed['Escape'] = true;
    } else if(game.menu === 'controls'){
      pressed['Escape'] = true;
    }
  } else if(game.state === 'dialogue'){
    pressed['Enter'] = true;
  } else if(game.state === 'pause'){
    // 6 items at y=104,122,140,158,176,194
    for(let i=0;i<6;i++){
      const my = 104 + i*18;
      if(gx > W/2 - 80 && gx < W/2 + 80 && gy >= my-4 && gy < my+12){
        game.menuIndex = i;
        pressed['Enter'] = true;
        sfx('menu');
        return;
      }
    }
  } else if(game.state === 'inventory' || game.state === 'map'){
    pressed['Escape'] = true;
  } else if(game.state === 'dead'){
    if(game.deathTimer > 1.0) pressed['Enter'] = true;
  } else if(game.state === 'victory'){
    if(game.victoryTimer > 2) pressed['Enter'] = true;
  }
}

// Update touch-controls visibility based on game state
function updateTouchVisibility(){
  if(!touchEnabled) return;
  const tc = document.getElementById('touch-controls');
  if(game.state === 'play' || game.state === 'pause'){
    tc.classList.add('active');
  } else {
    tc.classList.remove('active');
  }
}

/* -------------------------------------------------------------------- AUDIO */
let AC=null, masterGain=null, musicGain=null, sfxGain=null;
let audioReady=false;
const volumes = { master:0.6, sfx:0.8, music:0.35 };
function initAudio(){
  if(audioReady) return;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = volumes.master; masterGain.connect(AC.destination);
    sfxGain = AC.createGain(); sfxGain.gain.value = volumes.sfx; sfxGain.connect(masterGain);
    musicGain = AC.createGain(); musicGain.gain.value = volumes.music; musicGain.connect(masterGain);
    audioReady = true;
    if(AC.state === 'suspended') AC.resume();
    startDrone();
  }catch(e){ AC = null; }
}
function startDrone(){
  if(!AC) return;
  [55, 82.5, 110, 164.8].forEach((f,i)=>{
    const o = AC.createOscillator(); o.type = i%2 ? 'sine' : 'triangle'; o.frequency.value = f;
    const g = AC.createGain(); g.gain.value = 0.0;
    const lfo = AC.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.06 + i*0.031;
    const lg = AC.createGain(); lg.gain.value = 0.02;
    lfo.connect(lg); lg.connect(g.gain);
    o.connect(g); g.connect(musicGain); o.start(); lfo.start();
  });
}
function sfx(type){
  if(!AC || !audioReady) return;
  const now = AC.currentTime;
  if(type === 'swing'){
    const b = AC.createBufferSource(); b.buffer = noiseBuffer();
    const f = AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=1100;
    const g = AC.createGain(); g.gain.setValueAtTime(0.22, now);
    g.gain.exponentialRampToValueAtTime(0.001, now+0.11);
    b.connect(f); f.connect(g); g.connect(sfxGain); b.start();
  } else if(type === 'hit'){
    tone(180, 0.09, 'square', 0.28, 60);
    const b = AC.createBufferSource(); b.buffer = noiseBuffer();
    const f = AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800;
    const g = AC.createGain(); g.gain.setValueAtTime(0.22, now);
    g.gain.exponentialRampToValueAtTime(0.001, now+0.08);
    b.connect(f); f.connect(g); g.connect(sfxGain); b.start();
  } else if(type === 'heavy') tone(90, 0.22, 'sawtooth', 0.3, 40);
  else if(type === 'jump')  tone(420, 0.1, 'square', 0.12, 720);
  else if(type === 'land')  tone(120, 0.08, 'sine', 0.18, 60);
  else if(type === 'hurt')  tone(220, 0.18, 'sawtooth', 0.25, 90);
  else if(type === 'ability'){ tone(520, 0.28, 'triangle', 0.22, 1400); tone(260, 0.3, 'sine', 0.18, 700); }
  else if(type === 'ultimate'){ tone(80, 0.9, 'sawtooth', 0.3, 400); tone(160, 0.9, 'square', 0.16, 800); }
  else if(type === 'pickup'){ tone(660, 0.1, 'square', 0.18, 990); setTimeout(()=>tone(990,0.12,'square',0.15,1320),70); }
  else if(type === 'die') tone(300, 0.5, 'sawtooth', 0.25, 60);
  else if(type === 'menu') tone(600, 0.05, 'square', 0.12, 700);
  else if(type === 'boss'){ tone(55, 1.4, 'sawtooth', 0.35, 30); tone(110, 1.4, 'square', 0.2, 55); }
}
function tone(freq, dur, type, vol, slideTo){
  if(!AC) return;
  const now = AC.currentTime;
  const o = AC.createOscillator(); o.type = type||'square';
  o.frequency.setValueAtTime(freq, now);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), now+dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol||0.2, now);
  g.gain.exponentialRampToValueAtTime(0.001, now+dur);
  o.connect(g); g.connect(sfxGain); o.start(now); o.stop(now+dur+0.02);
}
let _noiseCache = null;
function noiseBuffer(){
  if(_noiseCache) return _noiseCache;
  const len = Math.floor(AC.sampleRate * 0.5);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  _noiseCache = buf; return buf;
}

/* ---------------------------------------------------------------- WORLD DATA */
const AREAS = [

const P_MAX = 1000;
const particles = new Array(P_MAX);
for(let i=0;i<P_MAX;i++) particles[i] = { life:0 };
let pIdx = 0;
function spawnP(x, y, vx, vy, life, size, color, opts){
  const p = particles[pIdx]; pIdx = (pIdx+1) % P_MAX;
  p.x=x; p.y=y; p.vx=vx; p.vy=vy; p.life=life; p.maxLife=life;
  p.size=size; p.color=color;
  p.grav=0; p.drag=1; p.shrink=true; p.add=false; p.kind='pixel';
  p.px=x; p.py=y;
  if(opts) for(const k in opts) p[k] = opts[k];
  return p;
}
function burst(x,y,n,color,speed,life,size,opts){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = speed*(0.3+Math.random());
    spawnP(x,y,Math.cos(a)*s,Math.sin(a)*s, life*(0.6+Math.random()*0.8), size, color, opts);
  }
}
function updateParticles(dt){
  for(let i=0;i<P_MAX;i++){
    const p = particles[i]; if(p.life<=0) continue;
    p.px = p.x; p.py = p.y;
    p.life -= dt; p.vy += p.grav*dt;
    p.vx *= Math.pow(p.drag, dt*60); p.vy *= Math.pow(p.drag, dt*60);
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
}
function drawParticles(additive){
  CTX.save();
  if(additive) CTX.globalCompositeOperation = 'lighter';
  for(let i=0;i<P_MAX;i++){
    const p = particles[i]; if(p.life<=0) continue;
    if(!!p.add !== !!additive) continue;
    const t = p.life/p.maxLife;
    CTX.globalAlpha = Math.min(1, t*1.4);
    if(p.kind === 'pixel'){
      const s = p.shrink ? Math.max(1, Math.round(p.size*t)) : p.size;
      CTX.fillStyle = p.color;
      CTX.fillRect(Math.round(p.x)-((s/2)|0), Math.round(p.y)-((s/2)|0), s, s);
    } else if(p.kind === 'circle'){
      const r = p.shrink ? Math.max(1, p.size*t) : p.size;
      CTX.fillStyle = p.color;
      CTX.beginPath(); CTX.arc(p.x, p.y, r, 0, 7); CTX.fill();
    } else if(p.kind === 'spark'){
      CTX.strokeStyle = p.color;
      CTX.lineWidth = Math.max(1, p.size*t);
      CTX.beginPath(); CTX.moveTo(p.x, p.y); CTX.lineTo(p.px, p.py); CTX.stroke();
    } else if(p.kind === 'ring'){
      const r = (1-t)*p.size + 2;
      CTX.strokeStyle = p.color;
      CTX.lineWidth = Math.max(1, t*3);
      CTX.beginPath(); CTX.arc(p.x, p.y, r, 0, 7); CTX.stroke();
    }
  }
  CTX.restore();
  CTX.globalAlpha = 1;
}

/* --------------------------------------------------------- PIXEL DRAW HELPERS */
function pxLine(x1,y1,x2,y2,w,color){
  x1|=0; y1|=0; x2|=0; y2|=0;
  const dx = Math.abs(x2-x1), dy = Math.abs(y2-y1);
  const sx = x1<x2?1:-1, sy = y1<y2?1:-1;
  let err = dx-dy, x = x1, y = y1, guard = 0;
  const hw = Math.max(0, ((w/2)|0));
  CTX.fillStyle = color;
  while(guard++ < 500){
    CTX.fillRect(x-hw, y-hw, w, w);
    if(x===x2 && y===y2) break;
    const e2 = 2*err;
    if(e2 > -dy){ err -= dy; x += sx; }
    if(e2 <  dx){ err += dx; y += sy; }
  }
}
function pxLimb(x1,y1,x2,y2,w,color,outline){
  if(outline) pxLine(x1,y1,x2,y2,w+2,outline);
  pxLine(x1,y1,x2,y2,w,color);
}
function addGlow(x, y, r, color, alpha){
  const g = CTX.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, withA(color, alpha));
  g.addColorStop(1, withA(color, 0));
  CTX.fillStyle = g;
  CTX.beginPath(); CTX.arc(x, y, r, 0, 7); CTX.fill();
}

function playerHitbox(){ return { x:player.x-player.w/2, y:player.y-player.h, w:player.w, h:player.h }; }
function startAttack(name){
  const p = player;
  if(p.attack || p.hurtTimer>0 || p.dashTime>0 || p.castTime>0) return;
  p.attack = { name, def:ATTACKS[name], time:0, hitSet:new Set() };
  sfx('swing');
}
function updatePlayer(dt){
  const p = player;
  p.animTime += dt;
  p.invuln = Math.max(0, p.invuln - dt);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.hurtTimer = Math.max(0, p.hurtTimer - dt);
  p.coyote = Math.max(0, p.coyote - dt);
  p.jumpBuffer = Math.max(0, p.jumpBuffer - dt);
  p.landSquash = Math.max(0, p.landSquash - dt*5);
  p.idleBlink = Math.max(0, p.idleBlink - dt);
  if(!p.alive){ p.deathTime += dt; updatePlayerPose(dt); return; }
  if(p.ultimateTime > 0){
    p.ultimateTime -= dt; game.timeScale = 0.35;
    if(p.ultimateTime <= 0){ game.timeScale = 1; doUltimateDamage(); }
    updatePlayerPose(dt); return;
  }
  if(p.castTime > 0){
    p.castTime -= dt; p.vx *= 0.85;
    if(p.castTime <= 0) p.castType = null;
    applyPhysics(dt); updatePlayerPose(dt); return;
  }
  const busy = !!p.attack || p.hurtTimer > 0 || p.dashTime > 0;
  let ix = 0;
  if(down('KeyA','ArrowLeft')) ix -= 1;
  if(down('KeyD','ArrowRight')) ix += 1;

  if(p.dashTime > 0){
    p.dashTime -= dt; p.vx = p.dashDir * 380;
    if(p.dashTime <= 0) p.vx *= 0.35;
  } else if(!busy){
    if(ix !== 0) p.facing = ix;
    const speed = p.blocking ? 55 : 155;
    if(ix !== 0) p.vx += ix * 1500 * dt;
    else p.vx *= Math.pow(0.0008, dt);
    p.vx = clamp(p.vx, -speed, speed);
  } else p.vx *= Math.pow(0.02, dt);

  if(hit('KeyW','Space','ArrowUp')) p.jumpBuffer = 0.12;
  if(p.jumpBuffer > 0 && (p.onGround || p.coyote > 0) && p.dashTime<=0 && !p.attack){
    p.vy = -350; p.onGround = false; p.coyote = 0; p.jumpBuffer = 0; sfx('jump');
    for(let i=0;i<8;i++) spawnP(p.x+rnd(-6,6), p.y, rnd(-30,30), rnd(-15,25), 0.35, 2, '#8fa5c9', {grav:120, kind:'circle'});
  }

  if(hit('ShiftLeft','ShiftRight') && p.dashCd<=0 && !p.attack && p.hurtTimer<=0){
    p.dashTime = 0.22; p.dashCd = 0.55;
    p.dashDir = ix !== 0 ? ix : p.facing; p.facing = p.dashDir;
    p.invuln = Math.max(p.invuln, 0.30);
    sfx('swing');
    for(let i=0;i<14;i++){
      spawnP(p.x - p.dashDir*rnd(0,14), p.y-rnd(4,24), -p.dashDir*rnd(20,80), rnd(-20,20),
        0.35, rnd(1,3), '#5fd6ff', {add:true, kind:'circle'});
    }
  }

  p.blocking = down('KeyS','ArrowDown') && p.onGround && !p.attack && p.dashTime<=0 && p.hurtTimer<=0;
  if(p.blocking) p.blockTime += dt; else p.blockTime = 0;

  if(!busy){
    if(hit('KeyJ')){ p.onGround ? startAttack('light1') : startAttack('air'); }
    else if(hit('KeyK')) startAttack('heavy');
    else if(hit('KeyL')) castElement();
    else if(hit('KeyU')) tryUltimate();
  } else if(p.attack){
    if(hit('KeyJ')) p.comboQueued = true;
  }

  if(p.attack){
    const a = p.attack; a.time += dt; const d = a.def;
    const total = d.startup + d.active + d.recover;
    if(a.time >= d.startup && a.time < d.startup + d.active) doAttackHit(a);
    if(a.time >= total){
      if(p.comboQueued && d.next){
        p.comboQueued = false;
        const nn = d.next; p.attack = null; startAttack(nn);
      } else { p.attack = null; p.comboQueued = false; }
    }
    if(p.attack && p.attack.name === 'dashAtk') p.vx = p.facing * 240;
  }

  if(hit('Digit1') && p.unlocked.water){ p.element='water'; toast('WATER STYLE'); }
  if(hit('Digit2') && p.unlocked.flame){ p.element='flame'; toast('FLAME STYLE'); }
  if(hit('Digit3') && p.unlocked.lightning){ p.element='lightning'; toast('LIGHTNING STYLE'); }
  if(hit('Digit4') && p.unlocked.wind){ p.element='wind'; toast('WIND STYLE'); }

  applyPhysics(dt);
  updatePlayerPose(dt);

  if(p.y > 330){
    damagePlayer(18, 0, 0, true);
    if(p.alive){ p.x = p.checkpoint; p.y = 200; p.vx = 0; p.vy = 0; p.invuln = 1.2; }
  }
  for(const cp of CHECKPOINTS){
    if(p.x > cp && cp > p.checkpoint){
      p.checkpoint = cp; p.hp = Math.min(p.maxHp, p.hp + 25); toast('CHECKPOINT');
      for(let i=0;i<22;i++) spawnP(cp+rnd(-20,20), 224-rnd(0,40), rnd(-20,20), rnd(-70,-10), 1.0, 2, '#ffd98a', {add:true, kind:'circle'});
    }
  }
}

function applyPhysics(dt){
  const p = player;
  p.vy = Math.min(p.vy + GRAV*dt, 620);
  p.x += p.vx*dt;
  const prevFeet = p.y;
  p.y += p.vy*dt;
  p.onGround = false;
  if(p.vy >= 0){
    let bestTop = Infinity;
    const left = p.x - p.w/2 + 2, right = p.x + p.w/2 - 2;
    for(const s of GROUNDS.concat(PLATFORMS)){
      if(right < s.x || left > s.x + s.w) continue;
      if(prevFeet <= s.y+0.5 && p.y >= s.y && s.y < bestTop) bestTop = s.y;
    }
    if(bestTop !== Infinity){
      if(p.vy > 240){
        sfx('land'); p.landSquash = 1;
        for(let i=0;i<10;i++) spawnP(p.x+rnd(-9,9), p.y, rnd(-55,55), rnd(-45,-5), 0.45, 2, '#9db2cf', {grav:200, drag:0.9, kind:'circle'});
      }
      p.y = bestTop; p.vy = 0; p.onGround = true; p.coyote = 0.1;
    }
  }
  p.x = clamp(p.x, -180, WORLD_W - 40);
  for(const a of ARENAS){
    const b = bosses[a.bossId];
    if(b && b.active && !b.dead) p.x = clamp(p.x, a.x0+20, a.x1-20);
  }
}

function updatePlayerPose(dt){
  const p = player, o = p.poseTarget, t = p.animTime;
  o.hipX=0; o.hipY=-13; o.neckX=0; o.neckY=-23; o.headX=0; o.headY=-27;
  o.handFX=5; o.handFY=-16; o.handBX=-4; o.handBY=-16;
  o.footFX=3; o.footFY=0; o.footBX=-3; o.footBY=0;
  o.swordAng=-0.7; o.lean=0;

  if(!p.alive){
    o.hipY=-4; o.neckY=-7; o.headY=-9;
    o.handFX=8; o.handFY=-3; o.handBX=-8; o.handBY=-3;
    o.footFX=8; o.footBX=-8; o.swordAng=1.4; o.lean=1;
  } else if(p.ultimateTime > 0){
    const k = 1 - (p.ultimateTime/1.1);
    o.hipY=-14; o.neckY=-24; o.headY=-28;
    o.handFX=4+Math.sin(k*6)*6; o.handFY=-30;
    o.handBX=-6; o.handBY=-20;
    o.swordAng=-2.4+k*1.2; o.footFX=6; o.footBX=-6;
  } else if(p.castTime > 0){
    const k = 1 - (p.castTime/0.35);
    o.handFX=8+k*6; o.handFY=-20-k*4;
    o.handBX=-7; o.handBY=-18;
    o.swordAng=-0.2+k*0.5; o.lean=0.15;
    o.footFX=6; o.footBX=-6;
  } else if(p.dashTime > 0){
    o.hipY=-12; o.neckY=-21; o.headY=-25; o.lean=0.45;
    o.handFX=-2; o.handFY=-18; o.handBX=-10; o.handBY=-14;
    o.footFX=-6; o.footFY=-3; o.footBX=-10; o.footBY=-1; o.swordAng=2.6;
  } else if(p.attack){
    const a = p.attack, d = a.def;
    const swing = clamp((a.time - d.startup*0.4) / (d.active + d.startup*0.9), 0, 1);
    const eased = swing*swing*(3-2*swing);
    const ang = lerp(d.arc[0], d.arc[1], eased);
    const reach = 9 + Math.sin(eased*Math.PI)*5;
    o.handFX = Math.cos(ang)*reach;
    o.handFY = -20 + Math.sin(ang)*reach;
    o.swordAng = ang;
    o.handBX = -5 - Math.cos(ang)*3;
    o.handBY = -18;
    o.lean = 0.1 + eased*0.25;
    if(a.name === 'heavy'){ o.hipY=-12; o.neckY=-22; o.headY=-26; o.footFX=8; o.footBX=-8; }
    else { o.hipY=-13; o.neckY=-23; o.footFX=5; o.footBX=-6; }
    if(!p.onGround){ o.footFX=6; o.footFY=-6; o.footBX=-2; o.footBY=-4; }
  } else if(!p.onGround){
    if(p.vy < 0){
      o.hipY=-14; o.neckY=-24; o.headY=-28;
      o.footFX=6; o.footFY=-7; o.footBX=-4; o.footBY=-3;
      o.handFX=7; o.handFY=-22; o.handBX=-8; o.handBY=-20; o.swordAng=-1.4;
    } else {
      o.hipY=-13; o.neckY=-23; o.headY=-27;
      o.footFX=7; o.footFY=-2; o.footBX=-6; o.footBY=0;
      o.handFX=8; o.handFY=-17; o.handBX=-8; o.handBY=-19; o.swordAng=-0.4;
    }
    o.lean = 0.08;
  } else if(p.blocking){
    o.handFX=9; o.handFY=-20; o.handBX=4; o.handBY=-19;
    o.swordAng=-1.55; o.lean=-0.05; o.footFX=5; o.footBX=-6;
  } else if(p.hurtTimer > 0){
    o.lean=-0.35;
    o.handFX=2; o.handFY=-22; o.handBX=-8; o.handBY=-20;
    o.headY=-26; o.headX=-2;
    o.footFX=2; o.footBX=-6; o.swordAng=-2.2;
  } else if(Math.abs(p.vx) > 12){
    const ph = t*13, swing = Math.sin(ph);
    o.footFX = swing*8; o.footFY = -Math.max(0, Math.sin(ph))*6;
    o.footBX = -swing*8; o.footBY = -Math.max(0, Math.sin(ph+Math.PI))*6;
    o.hipY = -13 - Math.abs(swing)*1.2;
    o.neckY = -23 - Math.abs(swing)*1.2;
    o.headY = -27 - Math.abs(swing)*1.2;
    o.lean = 0.16;
    o.handFX = 6 + Math.sin(ph+Math.PI)*2; o.handFY = -16;
    o.handBX = -6 - Math.sin(ph)*3; o.handBY = -17;
    o.swordAng = -1.35;
  } else {
    const br = Math.sin(t*2.1);
    o.hipY=-13+br*0.6; o.neckY=-23+br*0.6; o.headY=-27+br*0.6;
    o.handFX=5+br*0.5; o.handFY=-16+br*0.8;
    o.handBX=-4-br*0.4; o.handBY=-16+br*0.8;
    o.swordAng=-0.7+br*0.05;
  }
  const blend = Math.min(1, dt*22);
  for(const k of POSE_KEYS) p.pose[k] = lerp(p.pose[k], o[k], blend);
}

function doAttackHit(a){
  const p = player, d = a.def;
  const hb = { x: p.facing>0 ? p.x+2 : p.x-d.reach-2, y: p.y+d.offY-d.height/2, w:d.reach, h:d.height };
  const ang = p.pose.swordAng;
  const hx = p.x + Math.cos(ang)*10*p.facing;
  const hy = p.y - 20 + Math.sin(ang)*10;
  if(Math.random() < 0.8){
    spawnP(hx+rnd(-6,6), hy+rnd(-6,6), rnd(-20,20), rnd(-20,20), 0.22, 2,
      d.heavy ? '#ffe9a8' : '#cfe8ff', {add:true, kind:'circle'});
  }
  for(const e of enemies){
    if(!e.alive || e.dead || a.hitSet.has(e.id)) continue;
    if(aabb(hb, e.box())){
      a.hitSet.add(e.id);
      hitEnemy(e, d.dmg, d.kb*p.facing, d.launch, d.heavy);
      p.energy = Math.min(p.maxEnergy, p.energy + d.energy);
      game.comboCount++; game.comboTimer = 1.6;
      game.hitstop = Math.max(game.hitstop, d.heavy?0.075:0.035);
      game.shake = Math.max(game.shake, d.heavy?4:2);
      addDamageNumber(e.x, e.y-e.h, d.dmg, d.heavy);
    }
  }
  for(const b of bossList){
    if(!b.active || b.dead || a.hitSet.has(b.id)) continue;
    if(aabb(hb, b.box())){
      a.hitSet.add(b.id);
      hitBoss(b, d.dmg, d.kb*p.facing, d.heavy);
      p.energy = Math.min(p.maxEnergy, p.energy + d.energy);
      game.comboCount++; game.comboTimer = 1.6;
      game.hitstop = Math.max(game.hitstop, d.heavy?0.08:0.04);
      game.shake = Math.max(game.shake, d.heavy?5:2);
      addDamageNumber(b.x, b.y-b.h, d.dmg, d.heavy);
    }
  }
}
function addDamageNumber(x, y, dmg, big){
  game.damageNums.push({ x, y, dmg, life:0.7, maxLife:0.7, big:!!big, vy:-40 });
}
function hitEnemy(e, dmg, kbx, kby, heavy){
  if(e.hitFlash > 0) return;
  let finalDmg = dmg;
  if(e.type === 'guardian' && !heavy){
    const fromFront = (player.x - e.x) * e.facing > 0;
    if(fromFront) finalDmg = Math.max(1, Math.round(dmg*0.2));
  }
  e.hp -= finalDmg; e.hitFlash = 0.13;
  e.vx += kbx * (e.type==='guardian' ? 0.35 : 1);
  if(kby) e.vy = kby;
  e.stagger = Math.max(e.stagger, heavy ? 0.45 : 0.16);
  e.state = 'hurt'; e.stateTime = 0;
  sfx(heavy?'heavy':'hit');
  burst(e.x, e.y-e.h*0.6, heavy?16:8, '#ff9a4d', heavy?220:140, 0.4, 2, {add:true, kind:'circle'});
  burst(e.x, e.y-e.h*0.6, heavy?10:5, '#fff2c0', heavy?280:180, 0.25, 2, {add:true, kind:'spark'});
  spawnP(e.x, e.y-e.h*0.5, 0, 0, 0.35, heavy?18:12, '#fff2c0', {add:true, kind:'ring'});
  game.flash = Math.max(game.flash, heavy?0.32:0.14);
  game.flashColor = '#fff';
  if(e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  e.alive = false; e.dead = true; e.deathTime = 0;
  player.energy = Math.min(player.maxEnergy, player.energy + 12);
  game.comboCount += 1; sfx('die');
  burst(e.x, e.y-e.h*0.5, 26, '#7a5bff', 180, 0.7, 3, {add:true, kind:'circle'});
  burst(e.x, e.y-e.h*0.5, 14, '#ffffff', 130, 0.45, 2, {add:true, kind:'spark'});
  spawnP(e.x, e.y-e.h*0.5, 0, 0, 0.6, 32, '#a07aff', {add:true, kind:'ring'});
  game.shake = Math.max(game.shake, 3);
  if(Math.random() < 0.35){
    pickups.push({ x:e.x, y:e.y-10, type:'hp', taken:false, bob:Math.random()*6 });
  }
}

function castElement(){

  p.energy -= cfg.cost; p.castTime = 0.35; p.castType = el; p.vx = 0;
  sfx('ability'); game.flash = 0.2; game.flashColor = cfg.color;
  const dir = p.facing;
  if(el === 'water'){
    projectiles.push({ x:p.x+dir*16, y:p.y-16, vx:dir*300, vy:0, w:22, h:20, dmg:20, life:1.1, owner:'player', color:'#4fc3ff', kind:'wave', hitSet:new Set(), pierce:true });

  } else if(el === 'lightning'){
    for(let i=0;i<5;i++){

        for(const b of bossList) if(b.active && !b.dead && aabb(hb, b.box())) hitBoss(b, 6, 20*dir, false);

      }, i*55);
    }
    for(let i=0;i<20;i++) spawnP(p.x+rnd(-6,6), p.y-rnd(0,30), rnd(-40,40), rnd(-140,-40), 0.5, 2, '#ffe94f', {add:true, kind:'circle'});
  } else if(el === 'wind'){
    for(let i=0;i<48;i++){
      const a = (i/48)*Math.PI*2;
      spawnP(p.x, p.y-18, Math.cos(a)*rnd(90,240), Math.sin(a)*rnd(90,240), 0.65, 2, i%2 ? '#8cf5b0' : '#e6fff0', {add:true, drag:0.9, kind:'circle'});
    }
    const hb = { x:p.x-70, y:p.y-58, w:140, h:66 };
    for(const e of enemies) if(e.alive && aabb(hb, e.box())) hitEnemy(e, 22, (e.x-p.x)*2, -140, true);
    for(const b of bossList) if(b.active && !b.dead && aabb(hb, b.box())) hitBoss(b, 22, sign(b.x-p.x)*80, true);
    game.shake = Math.max(game.shake, 5);
  }
}
function tryUltimate(){

  if(p.energy < p.maxEnergy){ toast('NEED FULL SPIRIT'); return; }
  p.energy = 0; p.ultimateTime = 1.1; p.invuln = 1.3;

const enemies = [];
let enemyId = 1;
function makeEnemy(type, x, y){
  const base = {
    id:enemyId++, type, x, y, vx:0, vy:0, facing:-1,
    alive:true, dead:false, deathTime:0, hitFlash:0, stagger:0,
    state:'idle', stateTime:0, attackCd:rnd(0.4,1.4), hurtTimer:0,
    animTime:Math.random()*10, onGround:false,
    patrolA:x-60, patrolB:x+60, patrolDir:-1, aggro:false, flying:false
  };
  if(type === 'grunt') Object.assign(base, { w:18, h:26, hp:32, maxHp:32, speed:70, dmg:9, atkRange:34 });
  else if(type === 'assassin') Object.assign(base, { w:14, h:28, hp:24, maxHp:24, speed:60, dmg:11, atkRange:40 });
  else if(type === 'guardian') Object.assign(base, { w:24, h:32, hp:70, maxHp:70, speed:38, dmg:17, atkRange:44 });
  else if(type === 'spirit') Object.assign(base, { w:16, h:24, hp:22, maxHp:22, speed:50, dmg:8, atkRange:170, flying:true });
  else if(type === 'elite') Object.assign(base, { w:24, h:34, hp:100, maxHp:100, speed:48, dmg:20, atkRange:50 });
  base.box = function(){ return { x:this.x-this.w/2, y:this.y-this.h, w:this.w, h:this.h }; };
  return base;
}
function spawnEnemies(){
  enemies.length = 0;
  const list = [
    ['grunt',620,224],['grunt',900,224],['grunt',1180,224],
    ['assassin',1600,224],['grunt',1800,224],['assassin',2050,200],
    ['guardian',2350,224],['grunt',2550,224],['spirit',2700,190],
    ['spirit',3000,180],['guardian',3200,224],['assassin',3400,200],
    ['elite',3700,224],['spirit',3900,170],['grunt',4050,224],
    ['guardian',4750,224],['assassin',4900,200],['spirit',5050,160],
    ['elite',5250,224],['grunt',5400,224],
    ['assassin',5700,224],['spirit',5900,170],['guardian',6100,224],['elite',6250,224]
  ];
  for(const [t,x,y] of list){
    if(flags['killed_'+t+'_'+x]) continue;
    enemies.push(makeEnemy(t, x, y));
  }
}
function updateEnemies(dt){
  const p = player;
  for(const e of enemies){
    if(e.dead){ e.deathTime += dt; continue; }
    if(!e.alive) continue;
    e.animTime += dt;
    e.hitFlash = Math.max(0, e.hitFlash - dt);
    e.stagger = Math.max(0, e.stagger - dt);
    e.attackCd = Math.max(0, e.attackCd - dt);
    e.stateTime += dt;
    const dx = p.x - e.x, dy = (p.y-p.h*0.5)-(e.y-e.h*0.5), d = Math.hypot(dx,dy);
    if(e.stagger > 0) e.vx *= Math.pow(0.02, dt);
    else {
      switch(e.type){
        case 'grunt': updateGrunt(e,dx,dy,d,dt); break;
        case 'assassin': updateAssassin(e,dx,dy,d,dt); break;
        case 'guardian': updateGuardian(e,dx,dy,d,dt); break;
        case 'spirit': updateSpirit(e,dx,dy,d,dt); break;
        case 'elite': updateElite(e,dx,dy,d,dt); break;
      }
    }
    if(!e.flying) e.vy = Math.min(e.vy + GRAV*dt, 620);
    else e.vy *= Math.pow(0.1, dt);
    e.x += e.vx*dt;
    const prevFeet = e.y; e.y += e.vy*dt;
    if(!e.flying){
      e.onGround = false;
      if(e.vy >= 0){
        let bestTop = Infinity;
        const left = e.x-e.w/2+2, right = e.x+e.w/2-2;
        for(const s of GROUNDS.concat(PLATFORMS)){
          if(right < s.x || left > s.x+s.w) continue;
          if(prevFeet <= s.y+0.5 && e.y >= s.y && s.y < bestTop) bestTop = s.y;
        }
        if(bestTop !== Infinity){ e.y = bestTop; e.vy = 0; e.onGround = true; }
      }
      if(e.y > 400){ e.alive = false; e.dead = true; e.deathTime = 0; }
    }
    e.vx *= Math.pow(0.25, dt);
  }
}
function enemyAttack(e, dmg, range){
  const hb = { x: e.facing>0 ? e.x : e.x-range, y: e.y-e.h, w:range, h:e.h+8 };
  if(aabb(hb, playerHitbox())) damagePlayer(dmg, e.facing*120, -60, false);
}
function updateGrunt(e,dx,dy,d,dt){
  if(d<190 && Math.abs(dy)<70){
    e.aggro = true; e.facing = sign(dx)||e.facing;
    if(d>32 && e.stagger<=0) e.vx = e.facing*e.speed;
    else if(e.attackCd<=0 && e.state!=='attack'){ e.state='attack'; e.stateTime=0; e.attackCd=1.5; }
  } else {
    e.vx = e.patrolDir*e.speed*0.45;
    if(e.x<e.patrolA) e.patrolDir=1;
    if(e.x>e.patrolB) e.patrolDir=-1;
    e.facing = e.patrolDir;
  }
  if(e.state==='attack'){
    const t = e.stateTime;
    if(t>0.42 && t<0.56) enemyAttack(e, e.dmg, 38);
    if(t>0.85) e.state = 'idle';
  }
}
function updateAssassin(e,dx,dy,d,dt){
  if(d<230 && Math.abs(dy)<90){
    e.aggro = true; e.facing = sign(dx)||e.facing;
    if(e.state==='idle'){
      if(e.attackCd<=0){ e.state='windup'; e.stateTime=0; e.attackCd=1.6; }
      else e.vx = e.facing*40;
    } else if(e.state==='windup'){ if(e.stateTime>0.35){ e.state='dash'; e.stateTime=0; } }
    else if(e.state==='dash'){
      e.vx = e.facing*330;
      if(e.stateTime>0.06 && e.stateTime<0.28) enemyAttack(e, e.dmg, 30);
      if(e.stateTime>0.32){ e.state='retreat'; e.stateTime=0; }
    } else if(e.state==='retreat'){ e.vx = -e.facing*150; if(e.stateTime>0.45) e.state='idle'; }
  } else {
    e.vx = e.patrolDir*35;
    if(e.x<e.patrolA) e.patrolDir=1;
    if(e.x>e.patrolB) e.patrolDir=-1;
    e.facing = e.patrolDir; e.state = 'idle';
  }
}
function updateGuardian(e,dx,dy,d,dt){
  if(d<170 && Math.abs(dy)<70){
    e.aggro = true; e.facing = sign(dx)||e.facing;
    if(e.state==='idle'){
      if(d>44) e.vx = e.facing*e.speed;
      else if(e.attackCd<=0){ e.state='attack'; e.stateTime=0; e.attackCd=2.0; }
    } else if(e.state==='attack'){
      const t = e.stateTime;
      if(t>0.65 && t<0.85) enemyAttack(e, e.dmg, 50);
      if(t>1.15) e.state = 'idle';
    }
  } else {
    e.vx = e.patrolDir*20;
    if(e.x<e.patrolA) e.patrolDir=1;
    if(e.x>e.patrolB) e.patrolDir=-1;
    e.facing = e.patrolDir;
  }
}
function updateSpirit(e,dx,dy,d,dt){
  e.flying = true;
  if(d<260){
    e.aggro = true; e.facing = sign(dx)||e.facing;
    const targetY = player.y - 60;
    e.vy = (targetY-e.y)*1.5;
    if(d<110) e.vx = -e.facing*60;
    else if(d>170) e.vx = e.facing*45;
    else e.vx *= 0.9;
    if(e.attackCd<=0){
      e.attackCd = 1.9; sfx('ability');
      const ang = Math.atan2((player.y-16)-e.y, player.x-e.x);
      projectiles.push({ x:e.x, y:e.y-10, vx:Math.cos(ang)*175, vy:Math.sin(ang)*175, w:10, h:10, dmg:8, life:3.0, owner:'enemy', color:'#b06bff', kind:'orb', hitSet:new Set() });
    }
  } else {
    e.vy = Math.sin(e.animTime*1.4)*14;
    e.vx = e.patrolDir*22;
    if(e.x<e.patrolA) e.patrolDir=1;
    if(e.x>e.patrolB) e.patrolDir=-1;
  }
}
function updateElite(e,dx,dy,d,dt){
  if(d<230 && Math.abs(dy)<80){
    e.aggro = true; e.facing = sign(dx)||e.facing;
    if(e.state==='idle'){
      if(d>56) e.vx = e.facing*e.speed;
      else if(e.attackCd<=0){ e.state = Math.random()<0.5?'attack':'slam'; e.stateTime=0; e.attackCd=1.8; }
    } else if(e.state==='attack'){
      const t = e.stateTime;
      if(t>0.55 && t<0.75) enemyAttack(e, e.dmg, 55);
      if(t>1.0) e.state = 'idle';
    } else if(e.state==='slam'){
      const t = e.stateTime;
      if(t>0.7 && t<0.85){
        enemyAttack(e, e.dmg+4, 70);
        game.shake = Math.max(game.shake, 4);
        for(const dir of [-1,1]){
          projectiles.push({ x:e.x+dir*20, y:e.y-6, vx:dir*190, vy:0, w:16, h:12, dmg:10, life:1.4, owner:'enemy', color:'#ff8a3d', kind:'wave', hitSet:new Set() });
        }
      }
      if(t>1.2) e.state = 'idle';
    }
  } else {
    e.vx = e.patrolDir*24;
    if(e.x<e.patrolA) e.patrolDir=1;
    if(e.x>e.patrolB) e.patrolDir=-1;
    e.facing = e.patrolDir;
  }
}

  } else if(b.hp < b.maxHp*0.5 && b.phase === 1){
    b.phase = 2; game.flash = 0.7; game.flashColor = '#ff3a5a'; game.shake = 8;
    toast('PHASE TWO'); sfx('boss');
    spawnP(b.x, b.y-b.h*0.5, 0, 0, 1.2, 100, '#ff5a7a', {add:true, kind:'ring'});
  }
}
function updateBosses(dt){
  const p = player;
  for(const b of bossList){
    if(!b.active) continue;
    if(b.dead){ b.deathTime += dt; continue; }
    b.animTime += dt;
    b.hitFlash = Math.max(0, b.hitFlash - dt);
    b.invuln = Math.max(0, b.invuln - dt);
    if(b.intro > 0){ b.intro -= dt; continue; }
    const dx = p.x - b.x, dy = (p.y-p.h*0.5)-(b.y-b.h*0.5), d = Math.hypot(dx,dy);
    b.attackCd = Math.max(0, b.attackCd - dt);
    b.stateTime += dt;
    if(b.kind === 'samurai') updateSamurai(b,dx,dy,d,dt);
    else updateWraith(b,dx,dy,d,dt);
    if(!b.flying){
      b.vy = Math.min(b.vy + GRAV*dt, 620);
      b.x += b.vx*dt;
      const prevFeet = b.y; b.y += b.vy*dt;
      if(b.vy >= 0){
        for(const s of GROUNDS.concat(PLATFORMS)){
          if(b.x-b.w/2+2 > s.x+s.w || b.x+b.w/2-2 < s.x) continue;
          if(prevFeet <= s.y+0.5 && b.y >= s.y){ b.y = s.y; b.vy = 0; b.onGround = true; break; }
        }
      }
    } else {
      b.x += b.vx*dt; b.y += b.vy*dt;
      b.vx *= Math.pow(0.05, dt); b.vy *= Math.pow(0.05, dt);
    }
    b.vx *= Math.pow(0.6, dt);
    const ar = ARENAS.find(a=>a.bossId===b.kind);
    if(ar) b.x = clamp(b.x, ar.x0+40, ar.x1-40);
  }
}
function updateSamurai(b,dx,dy,d,dt){
  b.facing = sign(dx)||b.facing;
  const spd = b.phase === 2 ? 1.35 : 1.0;
  if(b.state === 'idle'){
    if(d>60) b.vx = b.facing*55*spd;
    if(b.attackCd <= 0){
      const roll = Math.random();
      if(roll<0.35) b.state='swing';
      else if(roll<0.6) b.state='charge';
      else if(roll<0.85) b.state='slam';
      else b.state='shockwave';
      b.stateTime = 0; b.attackCd = (b.phase===2 ? 1.0 : 1.5);
    }
  } else if(b.state === 'swing'){
    const t = b.stateTime;
    if(t>0.55 && t<0.7){
      const hb = { x:b.facing>0?b.x:b.x-70, y:b.y-b.h, w:70, h:b.h+10 };
      if(aabb(hb, playerHitbox())) damagePlayer(18, b.facing*180, -90, false);
      game.shake = Math.max(game.shake, 4);
    }
    if(b.phase===2 && t>0.85 && t<1.0){
      const hb = { x:b.facing>0?b.x:b.x-70, y:b.y-b.h, w:70, h:b.h+10 };
      if(aabb(hb, playerHitbox())) damagePlayer(16, b.facing*160, -70, false);
    }
    if(t > (b.phase===2 ? 1.25 : 1.05)) b.state = 'idle';
  } else if(b.state === 'charge'){
    const t = b.stateTime;
    if(t<0.45) b.vx = -b.facing*30;
    else if(t<1.0){
      b.vx = b.facing*300*spd;
      const hb = { x:b.x-b.w/2, y:b.y-b.h, w:b.w, h:b.h };
      if(aabb(hb, playerHitbox())) damagePlayer(15, b.facing*220, -80, false);
    } else if(t>1.35) b.state = 'idle';
  } else if(b.state === 'slam'){
    const t = b.stateTime;
    if(t<0.4){ b.vy = -420; b.vx = sign(player.x-b.x)*160; }
    if(t>0.75 && b.onGround){
      game.shake = Math.max(game.shake, 8);
      const hb = { x:b.x-70, y:b.y-40, w:140, h:44 };
      if(aabb(hb, playerHitbox())) damagePlayer(20, sign(player.x-b.x)*160, -180, false);
      for(let i=0;i<28;i++) spawnP(b.x+rnd(-50,50), b.y, rnd(-180,180), rnd(-160,-20), 0.65, 3, '#c9a87a', {grav:400, kind:'circle'});
      spawnP(b.x, b.y, 0, 0, 0.5, 60, '#c9a87a', {add:true, kind:'ring'});
      b.state = 'idle';
    }
    if(t>2.0) b.state = 'idle';
  } else if(b.state === 'shockwave'){
    const t = b.stateTime;
    if(t>0.6 && t<0.75){
      for(const dir of [-1,1]){
        projectiles.push({ x:b.x+dir*24, y:b.y-10, vx:dir*230, vy:0, w:20, h:14, dmg:12, life:1.8, owner:'enemy', color:'#ff6a4a', kind:'wave', hitSet:new Set() });
      }
      game.shake = Math.max(game.shake, 5);
    }
    if(t>1.2) b.state = 'idle';
  }
}
function updateWraith(b,dx,dy,d,dt){
  b.facing = sign(dx)||b.facing;
  const spd = b.phase === 2 ? 1.4 : 1.0;
  const targetY = 224 - 70 + Math.sin(b.animTime*1.6)*10;
  b.vy = (targetY - b.y) * 2.2;
  if(b.state === 'idle'){
    if(d>130) b.vx = b.facing*50*spd; else b.vx = -b.facing*30;
    if(b.attackCd <= 0){
      const roll = Math.random();
      if(roll<0.3) b.state='volley';
      else if(roll<0.55) b.state='teleport';
      else if(roll<0.8) b.state='slash';
      else b.state='summon';
      b.stateTime = 0; b.attackCd = (b.phase===2 ? 0.9 : 1.4);
    }
  } else if(b.state === 'volley'){
    const t = b.stateTime;
    if(t>0.5 && !b._fired){
      b._fired = true;
      for(let i=0;i<3;i++){
        const ang = Math.atan2((player.y-16)-b.y, player.x-b.x) + (i-1)*0.22;
        projectiles.push({ x:b.x, y:b.y-20, vx:Math.cos(ang)*200, vy:Math.sin(ang)*200, w:10, h:10, dmg:11, life:3, owner:'enemy', color:'#b06bff', kind:'orb', hitSet:new Set() });
      }
      sfx('ability');
    }
    if(t>1.0){ b.state='idle'; b._fired=false; }
  } else if(b.state === 'teleport'){
    const t = b.stateTime;
    if(t>0.3 && !b._fired){
      b._fired = true;
      burst(b.x, b.y-24, 24, '#b06bff', 200, 0.6, 3, {add:true, kind:'circle'});
      b.x = clamp(player.x - player.facing*50, 6420, 7040);
      b.y = 224 - 60;
      burst(b.x, b.y-24, 24, '#b06bff', 200, 0.6, 3, {add:true, kind:'circle'});
      b.facing = sign(player.x - b.x)||1;
    }
    if(t>0.65 && t<0.85){
      const hb = { x:b.facing>0?b.x:b.x-80, y:b.y-b.h, w:80, h:b.h+12 };
      if(aabb(hb, playerHitbox())) damagePlayer(16, b.facing*200, -100, false);
      game.shake = Math.max(game.shake, 4);
    }
    if(t>1.1){ b.state='idle'; b._fired=false; }
  } else if(b.state === 'slash'){
    const t = b.stateTime;
    if(t>0.65 && t<0.85){
      const hb = { x:b.x-110, y:b.y-b.h-10, w:220, h:b.h+30 };
      if(aabb(hb, playerHitbox())) damagePlayer(19, sign(player.x-b.x)*180, -120, false);
      for(let i=0;i<30;i++) spawnP(b.x+rnd(-100,100), b.y-rnd(0,60), rnd(-40,40), rnd(-40,40), 0.55, 3, '#d76bff', {add:true, kind:'circle'});
      spawnP(b.x, b.y-b.h*0.5, 0, 0, 0.6, 120, '#d76bff', {add:true, kind:'ring'});
      game.flash = 0.25; game.flashColor = '#b06bff'; game.shake = Math.max(game.shake, 6);
    }
    if(t>1.3) b.state = 'idle';
  } else if(b.state === 'summon'){
    const t = b.stateTime;
    if(t>0.6 && !b._fired){
      b._fired = true;
      for(let i=0;i<2;i++){
        const e = makeEnemy('assassin', b.x + (i?70:-70), 224);
        e.patrolA = b.x-100; e.patrolB = b.x+100;
        enemies.push(e);
        burst(e.x, e.y-14, 18, '#7a5bff', 160, 0.6, 2, {add:true, kind:'circle'});
      }
    }
    if(t>1.2){ b.state='idle'; b._fired=false; }
  }
}

/* --------------------------------------------------------------- PROJECTILES */
const projectiles = [];
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const pr = projectiles[i];
    pr.life -= dt;
    pr.x += pr.vx*dt; pr.y += pr.vy*dt;
    if(pr.kind === 'wave') pr.vy = 0;
    if(pr.life <= 0){ projectiles.splice(i,1); continue; }
    if(Math.random()<0.7) spawnP(pr.x, pr.y, rnd(-10,10), rnd(-10,10), 0.25, 2, pr.color, {add:true, kind:'circle'});
    const box = { x:pr.x-pr.w/2, y:pr.y-pr.h/2, w:pr.w, h:pr.h };
    if(pr.owner === 'player'){
      for(const e of enemies){
        if(!e.alive || pr.hitSet.has(e.id)) continue;
        if(aabb(box, e.box())){
          pr.hitSet.add(e.id);
          hitEnemy(e, pr.dmg, sign(pr.vx)*120, -60, false);
          if(!pr.pierce){ projectiles.splice(i,1); break; }
        }
      }
      for(const b of bossList){
        if(!b.active || b.dead || pr.hitSet.has(b.id)) continue;
        if(aabb(box, b.box())){
          pr.hitSet.add(b.id);
          hitBoss(b, pr.dmg, 0, false);
          if(!pr.pierce){ projectiles.splice(i,1); break; }
        }
      }
    } else {
      if(pr.hitSet.has('player')) continue;
      if(aabb(box, playerHitbox())){
        pr.hitSet.add('player');
        damagePlayer(pr.dmg, sign(pr.vx)*140, -60, false);
        projectiles.splice(i,1);
      }
    }
    if(pr.x < -100 || pr.x > WORLD_W + 100) projectiles.splice(i,1);
  }
}

/* ------------------------------------------------------------- PLAYER DAMAGE */
function damagePlayer(dmg, kbx, kby, ignoreBlock){
  const p = player;
  if(p.invuln > 0 || !p.alive || p.ultimateTime > 0) return;
  if(!ignoreBlock && p.blocking){
    if(p.blockTime < 0.2 && p.blockTime > 0){
      p.invuln = 0.5; p.energy = Math.min(p.maxEnergy, p.energy + 20);
      game.hitstop = 0.1; game.flash = 0.6; game.flashColor = '#fff9a8'; game.shake = 6;
      sfx('heavy'); toast('PARRY!');
      for(let i=0;i<30;i++){
        const a = Math.random()*Math.PI*2;
        spawnP(p.x, p.y-18, Math.cos(a)*rnd(100,300), Math.sin(a)*rnd(100,300), 0.5, 2, '#fff9a8', {add:true, drag:0.9, kind:'circle'});
      }
      spawnP(p.x, p.y-18, 0, 0, 0.5, 40, '#fff9a8', {add:true, kind:'ring'});
      for(const e of enemies) if(e.alive && Math.abs(e.x-p.x) < 70){ e.stagger = 0.8; e.state='idle'; }
      return;
    } else {
      dmg = Math.round(dmg * 0.35);
      p.energy = Math.min(p.maxEnergy, p.energy + 5);
      game.flash = 0.15; game.flashColor = '#8fd6ff'; sfx('hit');
      burst(p.x+p.facing*8, p.y-18, 10, '#8fd6ff', 140, 0.35, 2, {add:true, kind:'spark'});
    }
  }
  p.hp -= dmg; p.invuln = 0.75; p.hurtTimer = 0.28;
  p.vx = kbx||0; p.vy = kby||-60; p.attack = null;
  game.hitstop = Math.max(game.hitstop, 0.06);
  game.shake = Math.max(game.shake, 5);
  game.flash = Math.max(game.flash, 0.35); game.flashColor = '#ff4a4a';
  game.comboCount = 0; sfx('hurt');
  burst(p.x, p.y-18, 16, '#ff4a4a', 180, 0.45, 2, {add:true, kind:'circle'});
  burst(p.x, p.y-18, 8, '#ffaaaa', 240, 0.3, 2, {add:true, kind:'spark'});
  if(p.hp <= 0){
    p.hp = 0; p.alive = false; p.deathTime = 0;
    game.state = 'dead'; game.deathTimer = 0; sfx('die');
  }
}

const dialogue = { active:false, lines:[], index:0, name:'', onEnd:null };

  dialogue.active = true; dialogue.name = name; dialogue.lines = lines;
  dialogue.index = 0; dialogue.onEnd = onEnd || null; game.state = 'dialogue';
}

  dialogue.index++;

/* =============================================================== RENDERING */
function drawSky(area){
  const pal = PALETTES[area];
  const g = CTX.createLinearGradient(0,0,0,H);
  g.addColorStop(0, pal.skyTop);
  g.addColorStop(0.45, pal.skyMid);
  g.addColorStop(0.8, pal.skyLow);
  g.addColorStop(1, pal.skyHorizon);
  CTX.fillStyle = g;
  CTX.fillRect(0,0,W,H);

  if(area !== 4){
    for(let i=0;i<80;i++){
      const sx = (hash(i*7+area*13) * W * 1.6 - camX*0.02) % W;
      const sy = hash(i*11+5) * 130;
      const tw = 0.5 + Math.sin(game.t*1.6 + i)*0.5;
      CTX.globalAlpha = 0.15 + tw*0.5;
      CTX.fillStyle = '#e8f0ff';
      const sz = hash(i*3+1) > 0.85 ? 2 : 1;
      CTX.fillRect(Math.round(sx), Math.round(sy), sz, sz);
    }
    CTX.globalAlpha = 1;
  }

  const mx = 372, my = 46 + Math.sin(game.t*0.2)*1;

  if(area === 4){
    CTX.globalAlpha = 0.25;
    const cg = CTX.createRadialGradient(mx,my,20,mx,my,120);
    cg.addColorStop(0, withA(pal.celestial, 0.7));
    cg.addColorStop(0.4, withA(pal.celestial, 0.25));
    cg.addColorStop(1, withA(pal.celestial, 0));
    CTX.fillStyle = cg;
    CTX.fillRect(mx-120, my-120, 240, 240);
    CTX.globalAlpha = 1;
    CTX.globalAlpha = 0.6;
    CTX.fillStyle = '#ff5a8a';
    CTX.beginPath(); CTX.arc(mx, my, 48, 0, 7); CTX.fill();
    CTX.globalAlpha = 1;
    CTX.fillStyle = '#ff2a5a';
    CTX.beginPath(); CTX.arc(mx, my, 38, 0, 7); CTX.fill();
    CTX.fillStyle = '#1a0208';
    CTX.beginPath(); CTX.arc(mx-6, my-4, 34, 0, 7); CTX.fill();
    CTX.globalAlpha = 0.4;
    for(let i=0;i<10;i++){
      const a = (i/10)*Math.PI*2 + game.t*0.2;
      const r1 = 40, r2 = 56 + Math.sin(game.t*2+i)*6;
      CTX.fillStyle = '#ff5a8a';
      CTX.beginPath();
      CTX.moveTo(mx+Math.cos(a)*r1, my+Math.sin(a)*r1);
      CTX.lineTo(mx+Math.cos(a-0.06)*r2, my+Math.sin(a-0.06)*r2);
      CTX.lineTo(mx+Math.cos(a+0.06)*r2, my+Math.sin(a+0.06)*r2);
      CTX.closePath(); CTX.fill();
    }
    CTX.globalAlpha = 1;
  } else {
    CTX.globalAlpha = 0.18;
    const cg = CTX.createRadialGradient(mx,my,10,mx,my,90);
    cg.addColorStop(0, withA(pal.celestial, 0.9));
    cg.addColorStop(1, withA(pal.celestial, 0));
    CTX.fillStyle = cg;
    CTX.fillRect(mx-90, my-90, 180, 180);
    CTX.globalAlpha = 1;
    CTX.fillStyle = pal.celestial;
    CTX.beginPath(); CTX.arc(mx, my, 18, 0, 7); CTX.fill();
    CTX.fillStyle = withA(pal.celestialGlow, 0.5);
    CTX.fillRect(mx-8, my-4, 4, 3);
    CTX.fillRect(mx+2, my-8, 3, 2);
    CTX.fillRect(mx+4, my+4, 5, 3);
    CTX.fillRect(mx-4, my+6, 2, 2);
    CTX.fillStyle = '#ffffff';
    CTX.fillRect(mx-9, my-9, 8, 3);
  }
}

function drawParallax(area, cx){
  const f1 = cx * 0.10, f2 = cx * 0.28, f3 = cx * 0.52;
  const pal = PALETTES[area];

  if(area === 0){
    CTX.fillStyle = mixHex(pal.skyLow, '#000', 0.35);

        CTX.fillStyle = pal.lightColor;
        CTX.fillRect(x+w*0.28, 224-h+16, 10, 12);
        CTX.fillStyle = mixHex(pal.skyLow, '#000', 0.7);
        CTX.fillRect(x+w*0.28+4, 224-h+16, 1, 12);
        CTX.fillRect(x+w*0.28, 224-h+22, 10, 1);
      }
    }
    for(let i=0;i<20;i++){
      const x = -f3 + i*140 - 40;
      CTX.fillStyle = '#181424';
      CTX.fillRect(x, 190, 2, 34);
      CTX.fillRect(x+18, 190, 2, 34);
      CTX.fillStyle = '#2a1e14';
      CTX.fillRect(x, 200, 20, 2);
      CTX.fillRect(x, 212, 20, 2);
    }

function drawGround(){
  for(const g of GROUNDS){
    if(g.x + g.w < camX - 50 || g.x > camX + W + 50) continue;
    const grad = CTX.createLinearGradient(0, g.y, 0, g.y+g.h);
    grad.addColorStop(0, '#1e2638');
    grad.addColorStop(0.15, '#101828');
    grad.addColorStop(1, '#050810');
    CTX.fillStyle = grad;
    CTX.fillRect(g.x, g.y, g.w, g.h);
    CTX.fillStyle = '#3a4a5a';
    CTX.fillRect(g.x, g.y, g.w, 1);
    CTX.fillStyle = '#2a3a4a';
    CTX.fillRect(g.x, g.y+1, g.w, 1);
    const area = areaAt(player.x);
    const isGrass = area !== 3 && area !== 4;
    if(isGrass){
      for(let i=0;i<g.w/6;i++){
        const x = g.x + i*6 + Math.floor(hash(i+g.x)*4);
        if(x < camX - 10 || x > camX + W + 10) continue;
        const h = 2 + Math.floor(hash(i*3+g.x)*4);
        const sway = Math.sin(game.t*1.5 + x*0.1)*0.5;
        CTX.fillStyle = '#2a4030';
        CTX.fillRect(x+sway, g.y-h, 1, h);
        CTX.fillRect(x+2+sway, g.y-h+1, 1, h-1);
        CTX.fillRect(x-1+sway, g.y-h+1, 1, h-1);
        CTX.fillStyle = '#3a5040';
        CTX.fillRect(x+sway, g.y-h, 1, 1);
      }
    }
    for(let i=0;i<g.w/22;i++){
      const x = g.x + Math.floor(hash(i*7+g.x)*g.w);
      const y = g.y + 8 + Math.floor(hash(i*11+g.x)*16);
      if(x < camX - 10 || x > camX + W + 10) continue;
      CTX.fillStyle = '#0a0e18';
      CTX.fillRect(x, y, 2, 1);
      CTX.fillStyle = '#1a2234';
      CTX.fillRect(x+1, y-1, 1, 1);
    }
    const sg = CTX.createLinearGradient(0, g.y+g.h*0.5, 0, g.y+g.h);
    sg.addColorStop(0, 'rgba(0,0,0,0)');
    sg.addColorStop(1, 'rgba(0,0,0,0.6)');
    CTX.fillStyle = sg;
    CTX.fillRect(g.x, g.y+g.h*0.5, g.w, g.h*0.5);
  }
  for(const pl of PLATFORMS){
    if(pl.x + pl.w < camX - 50 || pl.x > camX + W + 50) continue;
    if(pl.kind === 'wood'){
      CTX.fillStyle = '#2a1e14';
      CTX.fillRect(pl.x, pl.y, pl.w, pl.h);
      CTX.fillStyle = '#4a3222';
      CTX.fillRect(pl.x, pl.y, pl.w, 2);
      CTX.fillStyle = '#5a4030';
      CTX.fillRect(pl.x, pl.y, pl.w, 1);
      CTX.fillStyle = '#1a1208';
      for(let i=0;i<pl.w/12;i++) CTX.fillRect(pl.x+i*12, pl.y+2, 1, pl.h-2);
    } else {
      const grad = CTX.createLinearGradient(0, pl.y, 0, pl.y+pl.h);
      grad.addColorStop(0, '#3a3455');
      grad.addColorStop(1, '#1a1630');
      CTX.fillStyle = grad;
      CTX.fillRect(pl.x, pl.y, pl.w, pl.h);
      CTX.fillStyle = '#504a70';
      CTX.fillRect(pl.x, pl.y, pl.w, 1);
      CTX.fillStyle = '#2a2440';
      CTX.fillRect(pl.x, pl.y+1, pl.w, 1);
      CTX.fillStyle = '#1a1630';
      for(let i=0;i<pl.w/10;i++) CTX.fillRect(pl.x+i*10+2, pl.y+3, 6, 2);
    }
    CTX.globalAlpha = 0.15;
    CTX.fillStyle = '#6a7fd0';
    CTX.fillRect(pl.x, pl.y+pl.h, pl.w, 1);
    CTX.globalAlpha = 1;
  }
}

const PC = {
  out:'#08080f',
  hairD:'#0a0f22', hairM:'#1a2540', hairL:'#3a4d70', hairW:'#d0dcf0',
  skinD:'#a87a5a', skin:'#e8b890', skinL:'#f8d0a8',
  eye:'#60d0ff', eyeDark:'#1a2a3a',
  haoriD:'#0d1426', haori:'#1e2a48', haoriL:'#354a72',
  trim:'#b02a3a', trimL:'#e05060',
  sash:'#c03a4a',
  hakamaD:'#151a2a', hakama:'#232c42',
  boot:'#1a1208', bootL:'#3a2818',
  bladeL:'#e8f4ff', blade:'#a8c0e0',
  hilt:'#3a2418', tsuba:'#c8a24a'
};

function drawPlayer(){
  const p = player, pose = p.pose;
  const x = Math.round(p.x), y = Math.round(p.y);

  CTX.globalAlpha = p.onGround ? 0.4 : 0.22;
  CTX.fillStyle = '#000';
  CTX.beginPath(); CTX.ellipse(x, y+1, 11, 3, 0, 0, 7); CTX.fill();
  CTX.globalAlpha = 1;

  CTX.save();
  CTX.translate(x, y);
  if(p.landSquash > 0) CTX.scale(1 + p.landSquash*0.15, 1 - p.landSquash*0.15);
  CTX.scale(p.facing, 1);

  if(p.invuln > 0 && p.alive && p.ultimateTime<=0 && Math.floor(game.t*30)%2 === 0){
    CTX.globalAlpha = 0.45;
  }

  const hipX = pose.hipX, hipY = pose.hipY;
  const neckX = pose.neckX, neckY = pose.neckY;
  const headX = pose.headX, headY = pose.headY;
  const shX = neckX, shY = neckY + 2;

  const bfx = Math.round(pose.footBX), bfy = Math.round(pose.footBY);
  pxLimb(hipX-2, hipY, bfx, bfy-2, 4, PC.hakamaD, PC.out);
  CTX.fillStyle = PC.boot; CTX.fillRect(bfx-3, bfy-3, 7, 3);
  CTX.fillStyle = PC.bootL; CTX.fillRect(bfx-3, bfy-3, 7, 1);

  const bhx = Math.round(pose.handBX), bhy = Math.round(pose.handBY);
  pxLimb(shX-1, shY, bhx, bhy, 3, PC.haoriD, PC.out);

  CTX.fillStyle = PC.haoriD;
  const capeSway = Math.sin(p.animTime*5)*4;
  CTX.beginPath();
  CTX.moveTo(neckX-2, neckY);
  CTX.lineTo(neckX-4, neckY + 6);
  CTX.lineTo(neckX-14 - Math.abs(p.vx)*0.03, neckY + 14 + capeSway);
  CTX.lineTo(neckX-12, hipY + 4 + capeSway*0.5);
  CTX.lineTo(neckX-2, hipY + 2);
  CTX.closePath(); CTX.fill();
  CTX.strokeStyle = PC.trim;
  CTX.lineWidth = 1;
  CTX.beginPath();
  CTX.moveTo(neckX-14 - Math.abs(p.vx)*0.03, neckY + 14 + capeSway);
  CTX.lineTo(neckX-12, hipY + 4 + capeSway*0.5);
  CTX.stroke();

  pxLimb(hipX, hipY, neckX, neckY, 9, PC.haori, PC.out);
  CTX.fillStyle = PC.haoriL;
  CTX.fillRect(hipX-4, neckY+1, 2, 10);
  CTX.fillStyle = PC.haoriD;
  CTX.fillRect(neckX-3, neckY, 2, 4);
  CTX.fillRect(neckX+2, neckY, 2, 4);
  CTX.fillStyle = PC.sash;
  CTX.fillRect(hipX-4, hipY-4, 8, 3);
  CTX.fillStyle = PC.trim;
  CTX.fillRect(hipX-4, hipY-2, 8, 1);
  CTX.fillRect(neckX+3, neckY+2, 1, 8);

  const ffx = Math.round(pose.footFX), ffy = Math.round(pose.footFY);
  pxLimb(hipX+2, hipY, ffx, ffy-2, 4, PC.hakama, PC.out);
  CTX.fillStyle = PC.trim;
  CTX.fillRect(Math.round(hipX+3), Math.round((hipY+ffy)/2), 1, 4);
  CTX.fillStyle = PC.boot; CTX.fillRect(ffx-3, ffy-3, 7, 3);
  CTX.fillStyle = PC.bootL; CTX.fillRect(ffx-3, ffy-3, 7, 1);

  const hx = Math.round(headX), hy = Math.round(headY);
  CTX.fillStyle = PC.skinD;
  CTX.fillRect(hx-2, hy+4, 4, 2);
  CTX.fillStyle = PC.out;
  CTX.fillRect(hx-5, hy-5, 10, 10);
  CTX.fillStyle = PC.skin;
  CTX.fillRect(hx-4, hy-4, 8, 8);
  CTX.fillStyle = PC.skinL;
  CTX.fillRect(hx-4, hy-3, 2, 4);
  if(p.idleBlink > 0){
    CTX.fillStyle = PC.eyeDark;
    CTX.fillRect(hx+1, hy-1, 3, 1);
  } else {
    CTX.fillStyle = PC.eyeDark;
    CTX.fillRect(hx+1, hy-2, 3, 3);
    CTX.fillStyle = PC.eye;
    CTX.fillRect(hx+2, hy-1, 2, 2);
    CTX.fillStyle = '#ffffff';
    CTX.fillRect(hx+3, hy-2, 1, 1);
  }
  CTX.fillStyle = PC.skinD;
  CTX.fillRect(hx+1, hy+2, 2, 1);

  CTX.fillStyle = PC.hairD;
  CTX.fillRect(hx-5, hy-6, 10, 4);
  CTX.fillRect(hx-6, hy-5, 2, 6);
  CTX.fillRect(hx-5, hy-3, 2, 5);
  CTX.fillRect(hx-2, hy-9, 2, 4);
  CTX.fillRect(hx+2, hy-10, 2, 5);
  CTX.fillRect(hx+5, hy-7, 2, 4);
  CTX.fillRect(hx-8, hy-4, 2, 3);
  CTX.fillStyle = PC.hairW;
  CTX.fillRect(hx-4, hy-7, 2, 4);
  CTX.fillRect(hx-3, hy-6, 1, 2);
  CTX.fillStyle = PC.hairL;
  CTX.fillRect(hx-3, hy-6, 4, 1);

  const hx2 = Math.round(pose.handFX), hy2 = Math.round(pose.handFY);
  pxLimb(shX+1, shY, hx2-2, hy2-2, 3, PC.haori, PC.out);
  pxLimb(hx2-2, hy2-2, hx2, hy2, 3, PC.haori, PC.out);
  CTX.fillStyle = PC.skinD;
  CTX.fillRect(hx2-1, hy2-1, 3, 3);
  CTX.fillStyle = PC.skin;
  CTX.fillRect(hx2, hy2, 2, 2);

  const ang = pose.swordAng;
  const cos = Math.cos(ang), sin = Math.sin(ang);
  const hiltX = hx2 - cos*4, hiltY = hy2 - sin*4;
  const tipX = hx2 + cos*24, tipY = hy2 + sin*24;

  if(p.attack || p.castTime>0 || p.ultimateTime>0){
    CTX.save();
    CTX.globalCompositeOperation = 'lighter';
    CTX.globalAlpha = 0.45;
    pxLine(hx2, hy2, tipX, tipY, 6, ELEMENTS[p.element].color);
    CTX.restore();
  }
  pxLine(hx2, hy2, hiltX, hiltY, 2, PC.hilt);
  CTX.fillStyle = PC.hilt;
  CTX.fillRect(Math.round(hiltX)-1, Math.round(hiltY)-1, 2, 2);
  CTX.fillStyle = PC.tsuba;
  CTX.fillRect(Math.round(hx2)-2, Math.round(hy2)-2, 4, 4);
  CTX.fillStyle = '#e8c66a';
  CTX.fillRect(Math.round(hx2)-1, Math.round(hy2)-1, 2, 2);
  pxLine(hx2, hy2, tipX, tipY, 2, PC.blade);
  pxLine(hx2+cos*4, hy2+sin*4, tipX, tipY, 1, PC.bladeL);

  CTX.restore();
  CTX.globalAlpha = 1;

  if(p.attack){
    const a = p.attack, d = a.def, t = a.time;
    if(t > d.startup*0.5 && t < d.startup + d.active + 0.06){
      const k = clamp((t - d.startup*0.5) / (d.active + d.startup*0.8), 0, 1);
      const ang2 = lerp(d.arc[0], d.arc[1], k);
      drawSwordArc(p.x, p.y-20, ang2, p.facing, d.reach+8, ELEMENTS[p.element].color, 1-k*0.7, d.heavy);
    }
  }
  if(p.castTime > 0){
    const cfg = ELEMENTS[p.castType];
    const k = 1 - p.castTime/0.35;
    CTX.save();
    CTX.globalCompositeOperation = 'lighter';
    CTX.globalAlpha = (1-k)*0.7;
    const g = CTX.createRadialGradient(p.x, p.y-18, 0, p.x, p.y-18, 10+k*34);
    g.addColorStop(0, cfg.color2); g.addColorStop(0.5, cfg.color); g.addColorStop(1, withA(cfg.color, 0));
    CTX.fillStyle = g;
    CTX.beginPath(); CTX.arc(p.x, p.y-18, 10+k*34, 0, 7); CTX.fill();
    CTX.restore();
  }
  if(p.ultimateTime > 0){
    const cfg = ELEMENTS[p.element];
    const k = 1 - p.ultimateTime/1.1;
    CTX.save();
    CTX.globalCompositeOperation = 'lighter';
    CTX.globalAlpha = 0.5 + Math.sin(game.t*40)*0.2;
    const g = CTX.createRadialGradient(p.x, p.y-20, 0, p.x, p.y-20, 30+k*100);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, cfg.color2); g.addColorStop(0.7, cfg.color); g.addColorStop(1, withA(cfg.color, 0));
    CTX.fillStyle = g;
    CTX.beginPath(); CTX.arc(p.x, p.y-20, 30+k*100, 0, 7); CTX.fill();
    CTX.restore();
  }
}

function drawSwordArc(px, py, ang, facing, radius, color, alpha, heavy){
  const innerR = radius * 0.35;
  const spread = heavy ? 1.9 : 1.4;
  const a0 = ang - spread/2, a1 = ang + spread/2;
  const steps = 14;
  CTX.save();
  CTX.globalCompositeOperation = 'lighter';
  CTX.globalAlpha = alpha * 0.5;
  CTX.fillStyle = color;
  CTX.beginPath();
  for(let i=0;i<=steps;i++){
    const a = lerp(a0, a1, i/steps);
    const r = lerp(innerR, radius, Math.sin(i/steps*Math.PI));
    const x = px + Math.cos(a)*r*facing, y = py + Math.sin(a)*r;
    if(i===0) CTX.moveTo(x,y); else CTX.lineTo(x,y);
  }
  for(let i=steps;i>=0;i--){
    const a = lerp(a0, a1, i/steps);
    const r = innerR * (1 + Math.sin(i/steps*Math.PI)*0.3);
    const x = px + Math.cos(a)*r*facing, y = py + Math.sin(a)*r;
    CTX.lineTo(x,y);
  }
  CTX.closePath(); CTX.fill();
  CTX.globalAlpha = alpha * 0.75;
  CTX.fillStyle = '#ffffff';
  CTX.beginPath();
  for(let i=0;i<=steps;i++){
    const a = lerp(a0, a1, i/steps);
    const r = lerp(innerR*1.1, radius*0.85, Math.sin(i/steps*Math.PI));
    const x = px + Math.cos(a)*r*facing, y = py + Math.sin(a)*r;
    if(i===0) CTX.moveTo(x,y); else CTX.lineTo(x,y);
  }
  for(let i=steps;i>=0;i--){
    const a = lerp(a0, a1, i/steps);
    const r = innerR * (1 + Math.sin(i/steps*Math.PI)*0.35);
    const x = px + Math.cos(a)*r*facing, y = py + Math.sin(a)*r;
    CTX.lineTo(x,y);
  }
  CTX.closePath(); CTX.fill();
  CTX.restore();
}

function drawEnemy(e){
  if(e.dead && e.deathTime > 0.8) return;
  const x = Math.round(e.x), y = Math.round(e.y);
  CTX.save();
  CTX.translate(x, y);
  if(e.dead){
    CTX.globalAlpha = Math.max(0, 1 - e.deathTime/0.8);
    CTX.translate(0, e.deathTime*30);
    CTX.scale(1, Math.max(0.1, 1-e.deathTime*1.6));
  }
  CTX.scale(e.facing, 1);
  const flash = e.hitFlash > 0;
  const bob = Math.sin(e.animTime*4)*1.5;

  CTX.globalAlpha *= 0.35;
  CTX.fillStyle = '#000';
  CTX.beginPath(); CTX.ellipse(0, 0, e.w*0.5, 3, 0, 0, 7); CTX.fill();
  CTX.globalAlpha = e.dead ? Math.max(0, 1 - e.deathTime/0.8) : 1;

  if(e.type === 'grunt'){
    const body = flash ? '#ffffff' : '#1a1030';
    const dark = flash ? '#ffffff' : '#0a0618';
    CTX.save(); CTX.globalCompositeOperation = 'lighter';
    CTX.globalAlpha *= 0.25; addGlow(0, -14, 20, '#7a3aff', 0.5); CTX.restore();
    pxLimb(0, -6, 0, -18+bob, 12, body, dark);
    CTX.fillStyle = flash ? '#fff' : '#120a24';
    CTX.fillRect(-6, -26+bob, 12, 10);
    CTX.fillStyle = flash ? '#fff' : '#2a1440';
    CTX.fillRect(-6, -31+bob, 2, 6);
    CTX.fillRect(4, -31+bob, 2, 6);
    CTX.fillStyle = flash ? '#fff' : '#ff8a3d';
    CTX.fillRect(-4, -23+bob, 3, 2);
    CTX.fillRect(2, -23+bob, 3, 2);
    if(!flash){

      CTX.fillStyle = '#ff8a3d';

      CTX.fillRect(1, -24+bob, 5, 4);

    pxLimb(-4, -14+bob, -10, -6+bob, 2, body, null);

    pxLimb(-3, -6, -5, 0, 4, body, dark);
    pxLimb(3, -6, 5, 0, 4, body, dark);
  } else if(e.type === 'assassin'){
    const body = flash ? '#ffffff' : '#0e2030';
    const dark = flash ? '#ffffff' : '#040a10';
    CTX.save(); CTX.globalCompositeOperation = 'lighter';
    CTX.globalAlpha *= 0.22; addGlow(0, -16, 18, '#4fe0ff', 0.5); CTX.restore();
    pxLimb(0, -4, 0, -20+bob, 8, body, dark);
    CTX.fillStyle = flash ? '#fff' : '#0a1826';
    CTX.fillRect(-5, -27+bob, 10, 8);
    CTX.fillStyle = flash ? '#fff' : '#4fe0ff';
    CTX.fillRect(-4, -24+bob, 3, 2);
    CTX.fillRect(1, -24+bob, 3, 2);
    pxLimb(5, -18+bob, 13, -22+bob, 2, '#bfe6ff', null);
    pxLimb(-5, -18+bob, -12, -14+bob, 2, '#bfe6ff', null);
    pxLimb(-2, -4, -4, 0, 3, body, dark);
    pxLimb(2, -4, 4, 0, 3, body, dark);
    CTX.fillStyle = '#2a6a80';
    CTX.fillRect(-3, -21+bob, 6, 3);
    pxLimb(-3, -20+bob, -12, -16+bob+Math.sin(e.animTime*8)*2, 2, '#2a6a80', null);
  } else if(e.type === 'guardian' || e.type === 'elite'){
    const body = flash ? '#ffffff' : '#2a1a10';
    const armor = flash ? '#fff' : (e.type==='elite' ? '#4a2410' : '#3a2a20');
    if(e.type === 'elite'){
      CTX.save(); CTX.globalCompositeOperation = 'lighter';
      CTX.globalAlpha *= 0.25; addGlow(0, -20, 26, '#ff6a3a', 0.4); CTX.restore();
    }
    pxLimb(0, -8, 0, -22+bob, 16, body, '#0a0503');
    CTX.fillStyle = armor;
    CTX.fillRect(-10, -30+bob, 20, 10);
    CTX.fillStyle = flash ? '#fff' : '#1a0f08';
    CTX.fillRect(-10, -30+bob, 20, 2);
    CTX.fillStyle = flash ? '#fff' : '#ff3a2a';
    CTX.fillRect(-6, -26+bob, 4, 2);
    CTX.fillRect(2, -26+bob, 4, 2);
    CTX.fillStyle = armor;
    CTX.fillRect(-14, -24+bob, 6, 8);
    CTX.fillRect(8, -24+bob, 6, 8);
    CTX.fillStyle = flash ? '#fff' : '#1a0f08';
    CTX.fillRect(-14, -24+bob, 6, 2);
    CTX.fillRect(8, -24+bob, 6, 2);
    pxLimb(11, -20+bob, 22, -26+bob, 3, flash?'#fff':'#6a6a7a', null);
    pxLimb(-5, -8, -7, 0, 6, body, '#0a0503');
    pxLimb(5, -8, 7, 0, 6, body, '#0a0503');
    if(e.state === 'attack' || e.state === 'slam'){
      CTX.save(); CTX.globalCompositeOperation = 'lighter';
      CTX.globalAlpha = 0.7 + Math.sin(game.t*20)*0.3;
      CTX.fillStyle = '#ff3a2a';
      CTX.fillRect(-3, -38+bob, 6, 3);
      CTX.restore();
    }
  } else if(e.type === 'spirit'){
    const body = flash ? '#ffffff' : '#2a0f4a';
    const glow = flash ? '#fff' : '#b06bff';
    CTX.save(); CTX.globalCompositeOperation = 'lighter';
    CTX.globalAlpha *= 0.4; addGlow(0, -14+bob, 22, glow, 0.6); CTX.restore();
    CTX.fillStyle = body;
    CTX.beginPath();
    CTX.moveTo(0, -24+bob); CTX.lineTo(8, -18+bob); CTX.lineTo(6, -4+bob);
    CTX.lineTo(0, 0); CTX.lineTo(-6, -4+bob); CTX.lineTo(-8, -18+bob);
    CTX.closePath(); CTX.fill();
    CTX.fillStyle = flash ? '#fff' : '#3a1a5a';
    CTX.fillRect(-5, -20+bob, 3, 10);
    CTX.fillStyle = glow;
    CTX.fillRect(-4, -19+bob, 3, 2);
    CTX.fillRect(1, -19+bob, 3, 2);
    for(let i=0;i<4;i++){
      CTX.globalAlpha = (0.6 - i*0.12) * (flash?1:0.7);
      CTX.fillStyle = body;
      CTX.fillRect(-4+i*2, -4+bob+i*3, 6-i, 3);
    }
    CTX.globalAlpha = e.dead ? Math.max(0, 1 - e.deathTime/0.8) : 1;
  }

  if(e.aggro && e.state === 'attack' && e.stateTime < 0.5){
    CTX.save(); CTX.globalCompositeOperation = 'lighter';
    CTX.globalAlpha = 0.6 + Math.sin(game.t*30)*0.4;
    CTX.fillStyle = '#ff3a2a';
    CTX.fillRect(-3, -e.h-8, 6, 3);
    CTX.restore();
  }
  CTX.restore();

  if(e.alive && e.hp < e.maxHp){
    const bw = 24;
    CTX.fillStyle = 'rgba(0,0,0,0.75)';
    CTX.fillRect(x-bw/2-1, y-e.h-9, bw+2, 5);
    CTX.fillStyle = '#3a1010';
    CTX.fillRect(x-bw/2, y-e.h-8, bw, 3);
    CTX.fillStyle = '#ff4a4a';
    CTX.fillRect(x-bw/2, y-e.h-8, Math.max(0, bw*(e.hp/e.maxHp)), 3);
    CTX.fillStyle = 'rgba(255,255,255,0.4)';
    CTX.fillRect(x-bw/2, y-e.h-8, Math.max(0, bw*(e.hp/e.maxHp)), 1);
  }
}

function drawBoss(b){
  if(!b.active) return;
  if(b.dead && b.deathTime > 1.5) return;
  const x = Math.round(b.x), y = Math.round(b.y);
  CTX.save();
  CTX.translate(x, y);
  if(b.dead){ CTX.globalAlpha = Math.max(0, 1-b.deathTime/1.5); CTX.translate(0, b.deathTime*20); }
  CTX.scale(b.facing, 1);
  const flash = b.hitFlash > 0;
  const t = b.animTime, bob = Math.sin(t*2.5)*3;

  CTX.globalAlpha *= 0.4;
  CTX.fillStyle = '#000';
  CTX.beginPath(); CTX.ellipse(0, 0, b.w*0.6, 5, 0, 0, 7); CTX.fill();
  CTX.globalAlpha = b.dead ? Math.max(0, 1-b.deathTime/1.5) : 1;

  if(b.kind === 'samurai'){
    CTX.save(); CTX.globalCompositeOperation = 'lighter';
    CTX.globalAlpha *= 0.35; addGlow(0, -26, 44, b.phase===2?'#ff3a2a':'#8a3aff', 0.7); CTX.restore();
    const body = flash ? '#ffffff' : '#241a2e';
    const armor = flash ? '#fff' : '#3a2440';
    const dark = flash ? '#fff' : '#0a0610';
    pxLimb(-7, -16, -10, 0, 9, body, dark);
    pxLimb(7, -16, 10, 0, 9, body, dark);
    pxLimb(0, -16, 0, -40+bob, 20, body, dark);
    CTX.fillStyle = armor;
    CTX.fillRect(-11, -38+bob, 22, 6);
    CTX.fillRect(-11, -28+bob, 22, 5);
    CTX.fillStyle = flash ? '#fff' : '#5a3a60';
    CTX.fillRect(-11, -38+bob, 22, 1);
    CTX.fillStyle = armor;
    CTX.fillRect(-19, -42+bob, 9, 12);
    CTX.fillRect(10, -42+bob, 9, 12);
    CTX.fillStyle = flash ? '#fff' : '#5a3a60';
    CTX.fillRect(-19, -42+bob, 9, 2);
    CTX.fillRect(10, -42+bob, 9, 2);
    CTX.fillStyle = flash ? '#fff' : '#1a1224';
    CTX.fillRect(-7, -52+bob, 14, 12);
    CTX.fillStyle = flash ? '#fff' : (b.phase===2 ? '#ff3a2a' : '#ff8a3d');
    CTX.fillRect(-5, -48+bob, 4, 3);
    CTX.fillRect(2, -48+bob, 4, 3);
    if(!flash){
      CTX.save(); CTX.globalCompositeOperation = 'lighter';
      CTX.globalAlpha *= 0.7;
      CTX.fillStyle = b.phase===2 ? '#ff3a2a' : '#ff8a3d';
      CTX.fillRect(-7, -49+bob, 8, 5);
      CTX.fillRect(0, -49+bob, 8, 5);
      CTX.restore();
    }
    CTX.fillStyle = flash ? '#fff' : '#4a2a1a';
    CTX.fillRect(-8, -60+bob, 3, 10);
    CTX.fillRect(5, -60+bob, 3, 10);
    const swing = (b.state==='swing' && b.stateTime>0.35) ? Math.sin(clamp((b.stateTime-0.35)/0.35,0,1)*Math.PI)*2.2 : 0;
    const ang = -0.9 + swing;
    const hX = 14, hY = -34+bob;
    pxLimb(9, -36+bob, hX, hY, 5, body, dark);
    const tipX = hX + Math.cos(ang)*34;
    const tipY = hY + Math.sin(ang)*34;
    CTX.save(); CTX.globalCompositeOperation = 'lighter';
    CTX.globalAlpha *= 0.5;
    pxLine(hX, hY, tipX, tipY, 6, b.phase===2?'#ff5a3a':'#c04aff');
    CTX.restore();
    pxLine(hX, hY, tipX, tipY, 3, flash?'#fff':'#9aa8c0');
    CTX.fillStyle = flash ? '#fff' : '#c8a24a';
    CTX.fillRect(hX-4, hY-2, 8, 3);
  } else {
    CTX.save(); CTX.globalCompositeOperation = 'lighter';
    CTX.globalAlpha *= 0.4; addGlow(0, -26+bob, 56, b.phase===2?'#ff2a6a':'#a03aff', 0.6); CTX.restore();
    const body = flash ? '#ffffff' : '#1a0628';
    CTX.fillStyle = body;
    CTX.beginPath();
    CTX.moveTo(0, -50+bob); CTX.lineTo(18, -28+bob); CTX.lineTo(14, 0);
    CTX.lineTo(-14, 0); CTX.lineTo(-18, -28+bob);
    CTX.closePath(); CTX.fill();
    CTX.fillStyle = flash ? '#fff' : '#2a0c40';
    CTX.beginPath();
    CTX.moveTo(0, -48+bob); CTX.lineTo(10, -30+bob); CTX.lineTo(8, -8);
    CTX.lineTo(-2, -8); CTX.lineTo(-2, -30+bob);
    CTX.closePath(); CTX.fill();
    CTX.fillStyle = flash ? '#fff' : '#0d0318';
    CTX.beginPath();
    CTX.moveTo(0, -56+bob); CTX.lineTo(14, -38+bob); CTX.lineTo(-14, -38+bob);
    CTX.closePath(); CTX.fill();
    CTX.fillStyle = flash ? '#fff' : (b.phase===2 ? '#ff2a6a' : '#d76bff');
    CTX.fillRect(-7, -46+bob, 5, 3);
    CTX.fillRect(2, -46+bob, 5, 3);
    for(let i=0;i<6;i++){
      const a = t*1.2 + i*Math.PI/3;
      const rr = 30 + Math.sin(t*2+i)*6;
      CTX.save(); CTX.globalCompositeOperation = 'lighter';
      CTX.globalAlpha *= 0.6;
      CTX.fillStyle = b.phase===2 ? '#ff5a8a' : '#c07aff';
      CTX.fillRect(Math.cos(a)*rr, -28+bob+Math.sin(a)*rr*0.6, 3, 3);
      CTX.restore();
    }
    if(b.state === 'slash' && b.stateTime > 0.4){
      const k = clamp((b.stateTime-0.4)/0.45,0,1);
      const ang = lerp(-1.6, 1.2, k);
      CTX.save(); CTX.globalCompositeOperation = 'lighter';
      CTX.globalAlpha *= 0.7;
      pxLine(0, -30+bob, Math.cos(ang)*46, -30+bob+Math.sin(ang)*46, 6, '#d76bff');
      CTX.restore();
      pxLine(0, -30+bob, Math.cos(ang)*46, -30+bob+Math.sin(ang)*46, 2, '#ffffff');
    }
  }
  CTX.restore();
}
